<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111313">
  <title>Pallimustas — Game Master</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/abilities.css">
  <link rel="stylesheet" href="css/characters.css">
  <link rel="stylesheet" href="css/modals.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><div class="brand-name">Pallimustas</div><div class="brand-caption">Game master's ledger</div></div>
      </div>
      <div class="section-label">Campaign</div>
      <nav aria-label="Main navigation">
        <button class="nav-button active" data-view="overview"><span class="nav-icon">▦</span> DM Overview</button>
        <button class="nav-button" data-view="sheet"><span class="nav-icon">▤</span> Character Sheet</button>
        <button class="nav-button" data-view="buffs"><span class="nav-icon">✧</span> Afflictions</button>
      </nav>
      <div class="section-label roster-heading"><span>Party roster</span><span class="roster-count" id="roster-count"></span></div>
      <div class="roster" id="roster"></div>
      <div class="sidebar-bottom"><div class="save-note"><span class="save-dot" id="sync-dot"></span><span id="sync-status">Saved on this device</span></div></div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="breadcrumb">Campaign <span>/</span><strong id="breadcrumb-current">DM Overview</strong></div>
        <div class="topbar-actions"><div class="round-status"><span class="status-dot" id="top-sync-dot"></span><span id="top-sync-status">Local only</span> <span>·</span> <b id="top-turn">Round 1</b></div></div>
      </header>
      <div class="page" id="app"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
<script src="js/data/characters.js"></script>
<script src="js/data/afflictions.js"></script>

<script src="js/utils/helpers.js"></script>
<script src="js/utils/validation.js"></script>

<script src="js/systems/cooldown-system.js"></script>
<script src="js/systems/ability-system.js"></script>
<script src="js/systems/affliction-system.js"></script>
<script src="js/systems/equipment-system.js"></script>
<script src="js/systems/combat.js"></script>

<script src="js/ui/notifications.js"></script>
<script src="js/ui/ability-ui.js"></script>
<script src="js/ui/character-ui.js"></script>
<script src="js/ui/modal-ui.js"></script>

<script src="js/main.js"></script>
</body>
</html>
