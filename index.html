<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111313">
  <title>Pallimustas — Game Master</title>
  <style>
    /* A small, self-contained visual system keeps the sheet easy to move and customize. */
    :root {
      color-scheme: dark;
      --bg: #111313;
      --panel: #191c1b;
      --panel-raised: #202422;
      --panel-soft: #171a19;
      --line: #303633;
      --line-bright: #444c47;
      --text: #ecece4;
      --muted: #939b93;
      --faint: #68716b;
      --gold: #d8aa67;
      --gold-soft: #392f21;
      --green: #84aa81;
      --red: #d77769;
      --blue: #82a8ca;
      --purple: #aa91c9;
      --radius: 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }

    .sidebar {
      background: #151817; border-right: 1px solid var(--line); display: flex;
      flex-direction: column; min-height: 100vh; padding: 27px 16px 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
    .brand-mark {
      width: 39px; height: 39px; border: 1px solid #6c5739; border-radius: 12px;
      display: grid; place-items: center; background: #27231d; color: var(--gold); font-size: 19px;
    }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size: 17px; letter-spacing: .07em; }
    .brand-caption { margin-top: 3px; color: var(--faint); font-size: 9px; letter-spacing: .19em; text-transform: uppercase; }
    .section-label { margin: 38px 10px 11px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .nav-button {
      display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px;
      border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: var(--muted); text-align: left; cursor: pointer; font-size: 13px;
      transition: background .15s, color .15s, border-color .15s;
    }
    .nav-button:hover { background: var(--panel-raised); color: var(--text); }
    .nav-button.active { border-color: #4b3d2c; background: #29241d; color: #e7c38f; }
    .nav-icon { width: 18px; text-align: center; font-size: 15px; }
    .roster-heading { display: flex; align-items: center; justify-content: space-between; }
    .roster-count { border: 1px solid var(--line); border-radius: 20px; padding: 2px 7px; color: var(--faint); font-size: 10px; }
    .roster { display: grid; gap: 4px; }
    .roster .nav-button { padding: 9px 10px; font-size: 12px; }
    .roster .nav-button.active { color: var(--text); }
    .avatar {
      flex: 0 0 auto; width: 29px; height: 29px; display: grid; place-items: center;
      border: 1px solid var(--avatar-border, #66533a); border-radius: 9px;
      background: var(--avatar-bg, #322b21); color: var(--avatar-color, #e2bc84);
      font-size: 11px; font-weight: 700;
    }
    .roster-person { min-width: 0; flex: 1; display: block; }
    .roster-name { display: block; overflow-wrap: anywhere; }
    .roster-class { display: block; margin-top: 4px; color: var(--faint); font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }
    .turn-indicator { color: var(--gold); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; }
    .sidebar-bottom { margin-top: auto; padding: 16px 9px 0; }
    .save-note { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 10px; }
    .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    .workspace { min-width: 0; padding: 0 38px 38px; }
    .topbar {
      height: 76px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line); gap: 15px;
    }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb span { margin: 0 8px; color: var(--faint); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .round-status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .round-status b { color: var(--text); font-weight: 600; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px #84aa8150; }
    .page { max-width: 1220px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 34px 0 25px; }
    .eyebrow { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 9px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(26px, 3vw, 35px); font-weight: 500; letter-spacing: -.025em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 37px;
      padding: 0 13px; border: 1px solid var(--line-bright); border-radius: 8px;
      background: var(--panel-raised); color: var(--text); cursor: pointer; font-size: 11px;
      font-weight: 600; transition: background .15s, border-color .15s, transform .15s;
    }
    .button:hover { border-color: #65553d; background: #292a25; }
    .button:active { transform: translateY(1px); }
    .button.primary { border-color: #8c6b3f; background: #493923; color: #f0d7b0; }
    .button.primary:hover { background: #59472c; }
    .button.subtle { border-color: transparent; background: transparent; color: var(--muted); }
    .button.subtle:hover { border-color: var(--line); color: var(--text); }
    .button:disabled { cursor: not-allowed; opacity: .43; }

    .turn-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 17px 19px; border: 1px solid #54452f; border-radius: var(--radius);
      background: linear-gradient(110deg, #29251e, #201f1b 65%, #1c201d);
    }
    .turn-left { display: flex; align-items: center; gap: 13px; }
    .turn-symbol { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #645238; border-radius: 10px; color: var(--gold); font-size: 17px; }
    .turn-label { color: #c1a77f; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
    .turn-player { margin-top: 4px; font-family: Georgia, "Times New Roman", serif; font-size: 16px; }
    .turn-meta { margin-left: 2px; color: var(--muted); font-size: 11px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0 27px; }
    .summary-card { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .summary-top { display: flex; align-items: center; justify-content: space-between; }
    .summary-label { color: var(--muted); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
    .summary-icon { color: var(--faint); font-size: 13px; }
    .summary-value { margin-top: 10px; font-family: Georgia, "Times New Roman", serif; font-size: 26px; }
    .summary-foot { margin-top: 4px; color: var(--faint); font-size: 10px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
    .section-title { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 500; }
    .section-helper { color: var(--faint); font-size: 10px; }
    .player-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .player-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; transition: border-color .15s, transform .15s; }
    .player-card:hover { border-color: var(--line-bright); transform: translateY(-2px); }
    .player-card.current-turn { border-color: #65543a; }
    .player-card-head { display: flex; align-items: center; gap: 11px; padding: 16px 17px 13px; }
    .player-card-info { min-width: 0; flex: 1; }
    .player-card-name { font-family: Georgia, "Times New Roman", serif; font-size: 17px; }
    .player-card-class { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .turn-tag { padding: 4px 7px; border: 1px solid #54452f; border-radius: 20px; color: #d7b781; font-size: 9px; }
    .essence-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .card-essences { padding: 0 17px 13px; margin-top: -6px; }
    .essence-chip { padding: 4px 7px; border: 1px solid #4b3d2c; border-radius: 20px; background: #28231d; color: #d7bd93; font-size: 9px; }
    .card-bars { display: grid; gap: 10px; padding: 2px 17px 17px; }
    .bar-line { display: grid; grid-template-columns: 64px minmax(0, 1fr) 62px; align-items: center; gap: 9px; }
    .bar-name { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
    .bar-track { height: 5px; overflow: hidden; border-radius: 6px; background: #303633; }
    .bar-fill { height: 100%; border-radius: inherit; transition: width .2s; }
    .bar-fill.health { background: var(--red); }
    .bar-fill.mana { background: var(--blue); }
    .bar-fill.stamina { background: var(--green); }
    .bar-value { color: #c8cbc2; font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; }
    .quick-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
    .quick-stat { padding: 11px 8px; text-align: center; }
    .quick-stat + .quick-stat { border-left: 1px solid var(--line); }
    .quick-stat b { display: block; font-size: 12px; font-weight: 600; }
    .quick-stat span { display: block; margin-top: 3px; color: var(--faint); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }

    .sheet-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; align-items: start; gap: 17px; }
    .sheet-main, .sheet-aside { min-width: 0; }
    .identity-card, .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .identity-card { display: flex; align-items: center; gap: 14px; padding: 18px; margin-bottom: 14px; }
    .identity-avatar { width: 50px; height: 50px; border-radius: 14px; font-size: 17px; }
    .identity-info { min-width: 0; flex: 1; }
    .identity-name { font-family: Georgia, "Times New Roman", serif; font-size: 23px; }
    .identity-sub { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .identity-info .essence-list { margin-top: 9px; }
    .resource-panel { padding: 17px; }
    .resource-list { display: grid; gap: 16px; margin-top: 18px; }
    .resource-row { display: grid; grid-template-columns: 82px minmax(0, 1fr) 100px; align-items: center; gap: 12px; }
    .resource-title { font-size: 11px; font-weight: 650; }
    .resource-title small { display: block; margin-top: 4px; color: var(--faint); font-size: 9px; font-weight: 400; }
    .resource-track { height: 9px; overflow: hidden; border-radius: 9px; background: #303633; }
    .resource-fill { height: 100%; border-radius: inherit; transition: width .2s; }
    .resource-fill.health { background: linear-gradient(90deg, #9e4e45, #d77769); }
    .resource-fill.mana { background: linear-gradient(90deg, #527a9c, #82a8ca); }
    .resource-fill.stamina { background: linear-gradient(90deg, #5c805b, #91b88b); }
    .resource-controls { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
    .resource-number { min-width: 50px; color: var(--text); font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
    .resource-adjustment { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .resource-adjustment input { width: 58px; padding: 5px 6px; border: 1px solid var(--line-bright); border-radius: 6px; background: #171a19; color: var(--text); font: inherit; font-size: 11px; }
    .mini-button { width: 23px; height: 23px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: #222624; color: var(--muted); cursor: pointer; }
    .mini-button:hover { border-color: var(--line-bright); color: var(--text); }
    .stats-panel { margin-top: 14px; padding: 17px; }
    .stat-columns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 15px; }
    .stat-column { display: grid; grid-template-rows: repeat(2, minmax(66px, auto)); gap: 8px; }
    .core-stats { margin-top: 15px; }
    .stat-tile { min-height: 66px; padding: 11px; border: 1px solid #2c322e; border-radius: 8px; background: #171a19; }
    .stat-value { font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
    .stat-label { margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .stat-modifier { display: block; max-width: 100%; margin-top: 2px; color: var(--purple); cursor: help; font-size: .78em; line-height: 1.2; overflow-wrap: anywhere; }
    .stat-modifier:nth-of-type(4n + 1) { color: var(--purple); }
    .stat-modifier:nth-of-type(4n + 2) { color: var(--blue); }
    .stat-modifier:nth-of-type(4n + 3) { color: var(--green); }
    .stat-modifier:nth-of-type(4n + 4) { color: var(--gold); }
    .aside-panel { padding: 16px; }
    .aside-panel + .aside-panel { margin-top: 13px; }
    .aside-heading { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .next-turn { margin-top: 13px; display: flex; align-items: center; gap: 10px; }
    .next-name { font-size: 12px; }
    .next-label { margin-top: 4px; color: var(--faint); font-size: 9px; }
    .turn-actions { display: grid; gap: 8px; margin-top: 14px; }
    .turn-actions .button { width: 100%; }
    .regen-note { margin-top: 10px; color: var(--faint); font-size: 9px; line-height: 1.6; }
    .ability-section { margin-top: 25px; }
    .ability-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .ability-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .ability-section .ability-heading { grid-column: 1 / -1; }
    .ability-group { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .ability-group-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid var(--line); background: #1c201e; }
    .category-title { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .category-count { color: var(--faint); font-size: 9px; }
    .ability-list { display: grid; }
    .ability-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 14px; }
    .ability-row + .ability-row { border-top: 1px solid #272d29; }
    .ability-name { font-size: 11px; font-weight: 600; }
    .ability-description-details { margin-top: 4px; }
    .ability-description-details summary { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; color: var(--muted); cursor: pointer; font-size: 9px; line-height: 1.5; list-style: none; }
    .ability-description-details summary::-webkit-details-marker { display: none; }
    .ability-summary { min-width: 0; }
    .description-cue { flex: 0 0 auto; color: var(--faint); font-size: 8px; white-space: nowrap; }
    .ability-description-details[open] .description-cue::after { content: "−"; }
    .ability-description-details:not([open]) .description-cue::after { content: "Read more +"; }
    .ability-full-description { margin: 7px 0 0; padding: 8px 9px; border-left: 2px solid #625039; border-radius: 0 5px 5px 0; background: #171a19; color: #c3c6bd; font-size: 10px; line-height: 1.6; }
    .affliction-link { padding: 0; border: 0; background: transparent; color: #c9a7db; font: inherit; text-decoration: underline dotted; cursor: pointer; }
    .affliction-link:hover { color: #e1c8ef; }
    .essence-ability-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .essence-ability-group { min-width: 0; }
    .essence-ability-group .ability-row { grid-template-columns: minmax(0, 1fr) auto; }
    .racial-gifts-section { margin-top: 20px; }
    .equipment-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .equipment-attack-option { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 5px; }
    .equipment-title { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 4px 8px; white-space: nowrap; }
    .equipment-title .ability-name { font-size: 12px; }
    .equipment-type, .equipment-status { color: var(--muted); font-size: 9px; white-space: nowrap; }
    .equipment-attack-log { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; line-height: 1.6; }
    .equipment-attack-entry + .equipment-attack-entry { margin-top: 3px; }
    .equipment-row { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .equipment-row .ability-description { margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .variant-select { max-width: 190px; margin-top: 7px; padding: 5px 8px; border: 1px solid var(--line-bright); border-radius: 6px; background: #171a19; color: var(--text); font: inherit; font-size: 9px; }
    .passive-label { color: #b6a4ce; font-size: 9px; letter-spacing: .1em; }
    .ability-costs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .cost-chip { padding: 3px 6px; border: 1px solid #33414a; border-radius: 5px; color: #9ab8d2; font-size: 8px; }
    .cost-chip.stamina { border-color: #344337; color: #a7c3a0; }
    .cost-chip.cooldown { border-color: #41394b; color: #b6a4ce; }
    .cost-chip.passive-chip { border-color: #56482e; color: #e0bd7d; }
    .cost-chip.active-chip { border-color: #385044; color: #9dc5a6; }
    .ability-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .ability-tag { color: #87958a; font-size: 8px; }
    .crystal-list { display: grid; gap: 6px; margin-top: 8px; }
    .crystal-item, .crystal-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .crystal-item { justify-content: space-between; color: var(--muted); font-size: 9px; }
    .crystal-actions .button { min-height: 25px; padding: 0 7px; font-size: 8px; }
    .ability-action { min-width: 80px; display: grid; justify-items: end; gap: 5px; }
    .ability-action .button { min-height: 29px; padding: 0 10px; font-size: 9px; }
    .disabled-reason { color: var(--faint); font-size: 8px; text-align: right; }
    .empty-note { padding: 24px; color: var(--muted); text-align: center; font-size: 12px; }
    .toast {
      position: fixed; right: 24px; bottom: 22px; z-index: 5; max-width: min(360px, calc(100vw - 32px));
      padding: 11px 15px; border: 1px solid #54452f; border-radius: 9px; background: #26241f;
      color: #e9d7b7; box-shadow: 0 12px 35px #0008; font-size: 11px;
      opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #090b0ac9; }
    .modal { width: min(420px, 100%); padding: 21px; border: 1px solid var(--line-bright); border-radius: 13px; background: #1b1e1c; box-shadow: 0 25px 70px #0009; }
    .modal-close { float: right; min-width: 30px; min-height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-raised); color: var(--muted); cursor: pointer; }
    .modal h2 { margin: 0; font: 500 21px Georgia, "Times New Roman", serif; }
    .modal p { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .ability-cost-inputs { display: grid; gap: 12px; }
    .ability-cost-input { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
    .ability-cost-input input { width: 100%; padding: 9px 10px; border: 1px solid var(--line-bright); border-radius: 7px; background: #171a19; color: var(--text); font: inherit; }
    .affliction-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; align-items: end; gap: 10px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .affliction-form label { display: grid; gap: 6px; color: var(--muted); font-size: 10px; }
    .affliction-form input, .affliction-form select { min-width: 0; width: 100%; padding: 8px; border: 1px solid var(--line-bright); border-radius: 6px; background: #171a19; color: var(--text); font: inherit; }
    .affliction-player { padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .affliction-player + .affliction-player { margin-top: 10px; }
    .affliction-player-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .affliction-player-head .section-title { flex: 1; }
    .affliction-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
    .affliction-entry-name { font-size: 12px; font-weight: 650; }
    .affliction-entry-detail { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .affliction-entry-actions { display: flex; align-items: center; gap: 6px; }
    .affliction-count { min-width: 44px; color: var(--gold); font-size: 10px; text-align: center; }
    @media (max-width: 800px) { .affliction-form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .affliction-form .button { grid-column: 1 / -1; } }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    @media (max-width: 930px) {

     * Add costEffects to a passive to reduce mana/stamina costs for selected targets; abilityTags can limit which abilities are affected.

     * Add afflictionEffects to abilities to apply glossary statuses: { id, afflictionId, target, stacks, duration, maxStacksPerTurn }.
     * Add "unlocked-potential" to a character's tags to allow mana/stamina ability spending below zero. While either is negative, they cannot activate any abilities until both are nonnegative.
     * Use trigger: "resourceChange" with resourceEffectId and condition: "increase" or "decrease" for conditional applications.
     * Set stacksFromPercentageOfMax: true to apply one stack per 1% of the actual resource change, rounded up.
     * maxStacksPerTurn is counted per ability effect and target, then resets when its source character ends their turn.
     * A missing duration or duration: null means permanent; timed effects decrease on the affected character's turns.
     * Use maxTotalStacks to cap an ability's stacks from that source; maxStacksPerTurn caps its additions per source turn.
     * Example: afflictionEffects: [{ id: "equilibrium-ward", afflictionId: "impervious", target: "self", stacks: 1, duration: null, maxStacksPerTurn: 2, maxTotalStacks: 10 }].
     * Glossary entries may define statEffects: [{ stat, bonus, perStack }]; perStack defaults to true. Use null duration for a status that does not expire.
     * Glossary resourceEffects use { resource, amountPerStack } and restore that resource on each affected character's turn.
     * Toggle abilities use activeMode: "toggle" and may define upkeep costs per owner turn. Cost reductions apply normally on activation; for upkeep, each normal reduction is divided by 10 per second and multiplied by the 6-second turn length.
     * Toggle statEffects stay active until the ability is turned off and do not require a duration.
     * Cost effect targets can also use "others" to affect everyone except the source.
     * Mana Tide uses { durationRounds, maxRecovery, manaPerRecovery, growth }.
     * Mana spent after cost reductions while it is active adds the matching recovery bonus to the character who paid it.
     * Crystal summon abilities can use { crystalSummon: { max, disableTurns } } to track a limited number of crystals with independent owner-turn disable timers.

     * Each effect uses { id, resource, amount, target }; set amount to "XX" to ask on use.

     * Targets can be "self", "others", "party", "tagged", or "self-and-tagged" (characters with abilities carrying one configured tag, matched case-insensitively).

     *
     * Shared ability tags are ordinary tags such as "movement" and "blood".
     * Use "passive" to remove costs, cooldowns, and the use button.

     * Configure equipment as [{ id, name, type, summary, description, statEffects }].

    function allCharacterAbilities(character) {
      return [...character.abilities, ...(character.racialGifts || [])];
    }

    // Variants retain independent cooldown/effect clocks while remaining one listed ability.
    function abilityConfigurationKeys(character) {
      return allCharacterAbilities(character).flatMap((ability) => [
        ability.id,
        ...(ability.variants || []).map((variant) => `${ability.id}::${variant.id}`)
      ]);
    }

    function abilityStateKey(ability, variant) {
      return variant ? `${ability.id}::${variant.id}` : ability.id;
    }

    function findConfiguredStatEffect(sourceCharacterId, abilityId, configurationId, effectId) {
      const sourceCharacter = characterById(sourceCharacterId);
      const ability = sourceCharacter && allCharacterAbilities(sourceCharacter).find((entry) => entry.id === abilityId);
      if (!ability) return null;
      const configurations = [ability, ...(ability.variants || [])];
      const selectedConfiguration = configurations.find((entry) => entry.id === configurationId);
      return selectedConfiguration?.statEffects?.find((effect) => effect.id === effectId) ||
        ability.statEffects?.find((effect) => effect.id === effectId) ||
        null;
    }

    function statEffectTargets(effect, sourceCharacter) {
      if (effect.target === "self") return [sourceCharacter.id];
      if (effect.target === "others") return CHARACTERS.filter((character) => character.id !== sourceCharacter.id).map((character) => character.id);
      if (effect.target === "party") return CHARACTERS.map((character) => character.id);
      if (["tagged", "self-and-tagged"].includes(effect.target) && Array.isArray(effect.tags)) {
        const targetTags = effect.tags.map((tag) => tag.trim().toLowerCase());
        const taggedTargets = CHARACTERS.filter((character) =>
          allCharacterAbilities(character).some((ability) =>
            [...(ability.tags || []), ...(ability.variants || []).flatMap((variant) => variant.tags || [])]
              .some((tag) => typeof tag === "string" && targetTags.includes(tag.trim().toLowerCase()))
          )
        ).map((character) => character.id);
        return effect.target === "self-and-tagged"
          ? [...new Set([sourceCharacter.id, ...taggedTargets])]
          : taggedTargets;
      }
      return [];
    }

    function scaledDiceFormula(formula, multiplier) {
      const parsed = parseDiceFormula(formula);
      if (!parsed) return null;
      return formatDiceFormula({
        dice: new Map([...parsed.dice].map(([sides, count]) => [sides, count * multiplier])),
        flat: parsed.flat * multiplier
      });
    }

    function applyAffliction(characterId, afflictionId, stacks, duration, source) {
      if (!characterById(characterId) || !Object.hasOwn(AFFLICTION_GLOSSARY, afflictionId)) return;
      if (!Number.isSafeInteger(stacks) || stacks <= 0) return;
      state.afflictionSequence = (state.afflictionSequence || 0) + 1;
      state.activeAfflictions.push({
        id: `affliction-${state.afflictionSequence}`,
        characterId,
        afflictionId,
        stacks,
        remainingTurns: duration ?? null,
        source: String(source || "Manually added").slice(0, 160)
      });
    }

    function isValidAfflictionEffect(effect) {
      const inputStackRule = effect?.stacksFromInput;
      return Boolean(
        effect &&
        typeof effect.id === "string" && effect.id.trim() &&
        Object.hasOwn(AFFLICTION_GLOSSARY, effect.afflictionId) &&
        ["self", "others", "party", "tagged", "self-and-tagged"].includes(effect.target) &&
        (!["tagged", "self-and-tagged"].includes(effect.target) ||
          (Array.isArray(effect.tags) && effect.tags.length > 0 && effect.tags.every((tag) => typeof tag === "string" && tag.trim()))) &&
        (effect.stacks === undefined || (Number.isSafeInteger(effect.stacks) && effect.stacks > 0)) &&
        (inputStackRule === undefined || (
          inputStackRule &&
          typeof inputStackRule.field === "string" &&
          inputStackRule.field.trim() &&
          Number.isSafeInteger(inputStackRule.divisor) &&
          inputStackRule.divisor > 0
        )) &&
        (effect.stacksFromPercentageOfMax === undefined || typeof effect.stacksFromPercentageOfMax === "boolean") &&
        (effect.stacksFromPercentageOfMax !== true || effect.trigger === "resourceChange") &&
        (effect.duration === undefined || effect.duration === null || (Number.isSafeInteger(effect.duration) && effect.duration > 0)) &&
        (effect.maxStacksPerTurn === undefined || (Number.isSafeInteger(effect.maxStacksPerTurn) && effect.maxStacksPerTurn > 0)) &&
        (effect.maxTotalStacks === undefined || (Number.isSafeInteger(effect.maxTotalStacks) && effect.maxTotalStacks > 0)) &&
        (effect.trigger === undefined || effect.trigger === "onUse" || (
          effect.trigger === "resourceChange" &&
          typeof effect.resourceEffectId === "string" &&
          ["increase", "decrease"].includes(effect.condition)
        ))
      );
    }

    function isValidWeaponAfflictionEffect(effect) {
      return Boolean(
        effect &&
        typeof effect.id === "string" &&
        effect.id.trim() &&
        Object.hasOwn(AFFLICTION_GLOSSARY, effect.afflictionId) &&
        ["wielder", "selected", "wielder-and-selected"].includes(effect.target) &&
        (effect.stacks === undefined || (Number.isSafeInteger(effect.stacks) && effect.stacks > 0)) &&
        (effect.duration === undefined || effect.duration === null ||
          (Number.isSafeInteger(effect.duration) && effect.duration > 0)) &&
        (effect.maxStacksPerTurn === undefined ||
          (Number.isSafeInteger(effect.maxStacksPerTurn) && effect.maxStacksPerTurn > 0)) &&
        (effect.maxTotalStacks === undefined ||
          (Number.isSafeInteger(effect.maxTotalStacks) && effect.maxTotalStacks > 0))
      );
    }

    function applyConfiguredAfflictionEffect(sourceCharacter, ability, effect, targetCharacterId, stackCount) {
      const sourceProgress = state.characters[sourceCharacter.id];
      sourceProgress.afflictionApplicationsThisTurn ??= {};
      const countKey = `${ability.id}::${effect.id}::${targetCharacterId}`;
      const alreadyApplied = sourceProgress.afflictionApplicationsThisTurn[countKey] || 0;
      const source = `${sourceCharacter.name} · ${ability.name}`;
      const existingStacks = state.activeAfflictions
        .filter((entry) =>
          entry.characterId === targetCharacterId &&
          entry.afflictionId === effect.afflictionId &&
          entry.source === source
        )
        .reduce((total, entry) => total + entry.stacks, 0);
      const perTurnAllowance = effect.maxStacksPerTurn
        ? Math.max(0, effect.maxStacksPerTurn - alreadyApplied)
        : stackCount;
      const totalAllowance = effect.maxTotalStacks
        ? Math.max(0, effect.maxTotalStacks - existingStacks)
        : stackCount;
      const stacks = Math.min(stackCount, perTurnAllowance, totalAllowance);
      if (stacks <= 0) return;
      applyAffliction(
        targetCharacterId,
        effect.afflictionId,
        stacks,
        effect.duration,
        source
      );
      sourceProgress.afflictionApplicationsThisTurn[countKey] = alreadyApplied + stacks;
    }

    function equipmentAttacks(item) {
      if (Array.isArray(item.attacks) && item.attacks.length) {
        return item.attacks.filter((attack) => attack && typeof attack === "object").map((attack, index) => ({
          ...attack,
          id: typeof attack.id === "string" && attack.id ? attack.id : `attack-${index + 1}`,
          name: typeof attack.name === "string" && attack.name ? attack.name : `Attack ${index + 1}`,
          stats: attack.stats !== undefined
            ? attack.stats
            : [typeof attack.stat === "string" && attack.stat ? attack.stat : item.stat || "physicalAttack"],
          modifier: attack.modifier ?? item.modifier ?? ""
        }));

      return [{
        id: "default",
        name: "Attack",
        stats: item.attackStats !== undefined
          ? item.attackStats
          : [typeof item.stat === "string" && item.stat ? item.stat : "physicalAttack"],
        modifier: item.modifier ?? item.attack ?? ""
      }];
    }

    function abilityAttacks(ability) {
      if (!abilityHasAnyTag(ability, ["attack"])) return [];

    function isValidAttackConfiguration(character, item, attack) {
      const stats = attack.stats === undefined ? [attack.stat] : attack.stats;
      return Array.isArray(stats) && stats.length > 0 &&

    function statDisplayName(stat) {
      return stat.replace(/[A-Z]/g, (letter) => ` ${letter.toLowerCase()}`)
        .replace(/^./, (letter) => letter.toUpperCase());

    function parseDiceFormula(formula) {
      if (typeof formula === "number") {
        return Number.isFinite(formula) ? { dice: new Map(), flat: formula } : null;
      }
      if (typeof formula !== "string" || !formula.trim()) return null;
      const expression = formula.replace(/\s+/g, "");
      const termPattern = /([+-]?)(\d+(?:\.\d+)?)(?:[dD](\d+))?/gy;
      const result = { dice: new Map(), flat: 0 };
      let position = 0;
      let firstTerm = true;
      while (position < expression.length) {
        termPattern.lastIndex = position;
        const match = termPattern.exec(expression);
        if (!match || (!firstTerm && !match[1])) return null;
        const sign = match[1] === "-" ? -1 : 1;
        const amount = Number(match[2]) * sign;
        if (match[3]) {
          const count = Math.abs(amount);
          const sides = Number(match[3]);
          if (!Number.isSafeInteger(count) || !Number.isSafeInteger(sides) || sides < 1) return null;
          result.dice.set(sides, (result.dice.get(sides) || 0) + sign * count);
        } else {
          result.flat += amount;
        }
        position = termPattern.lastIndex;
        firstTerm = false;
      }
      return firstTerm ? null : result;
    }

    function formatDiceFormula(formula) {
      const terms = [...formula.dice.entries()]
        .filter(([, count]) => count !== 0)
        .sort(([sidesA], [sidesB]) => sidesA - sidesB)
        .map(([sides, count]) => ({ value: `${Math.abs(count)}D${sides}`, sign: Math.sign(count) }));
      if (formula.flat !== 0) {
        terms.push({ value: String(Math.abs(formula.flat)), sign: Math.sign(formula.flat) });
      }
      if (!terms.length) return "0";
      return terms.map((term, index) =>
        index === 0
          ? `${term.sign < 0 ? "-" : ""}${term.value}`
          : ` ${term.sign < 0 ? "-" : "+"} ${term.value}`
      ).join("");
    }

    function changeDiceSides(formula, sides) {
      if (!Number.isSafeInteger(sides) || sides < 1) return null;
      return {
        dice: formula.dice.size
          ? new Map([[sides, [...formula.dice.values()].reduce((total, count) => total + count, 0)]])
          : new Map(),
        flat: formula.flat
      };
    }

    function equipmentAttackResult(character, item, attack) {
      const multiplier = attack.damageMultiplier ?? item.damageMultiplier ?? 1;
      if (!Number.isFinite(multiplier) || multiplier <= 0) return null;
      const stats = attack.stats === undefined ? [attack.stat] : attack.stats;
      if (!Array.isArray(stats) || !stats.length || stats.some((stat) => typeof stat !== "string" || !Object.hasOwn(character.stats, stat))) return null;

      const configuredDieSides = attack.damageDieSides ?? item.damageDieSides;
      const transformDice = configuredDieSides !== undefined;
      const hasWeaponModifier = attack.modifier !== undefined && attack.modifier !== null && String(attack.modifier).trim() !== "";
      const rawWeaponFormula = hasWeaponModifier ? parseDiceFormula(attack.modifier) : { dice: new Map(), flat: 0 };
      if (!rawWeaponFormula) return null;
      const totalStatFormula = { dice: new Map(), flat: 0 };
      for (const stat of stats) {
        const rawStatFormula = parseDiceFormula(character.stats[stat]);
        const statFormula = rawStatFormula && transformDice
          ? changeDiceSides(rawStatFormula, configuredDieSides)
          : rawStatFormula;
        if (!statFormula) return null;
        for (const [sides, count] of statFormula.dice) {
          totalStatFormula.dice.set(sides, (totalStatFormula.dice.get(sides) || 0) + count);
        }
        totalStatFormula.flat += statFormula.flat;
      }
      const weaponFormula = transformDice ? changeDiceSides(rawWeaponFormula, configuredDieSides) : rawWeaponFormula;
      if (!weaponFormula) return null;

      for (const stat of stats) {
        for (const modifier of getStatModifiers(character, stat, false)) {
          const rawModifier = parseDiceFormula(modifier.bonus);
          const parsed = rawModifier && transformDice
            ? changeDiceSides(rawModifier, configuredDieSides)
            : rawModifier;
          if (!parsed) return null;
          for (const [sides, count] of parsed.dice) {
            totalStatFormula.dice.set(sides, (totalStatFormula.dice.get(sides) || 0) + count);
          }
          totalStatFormula.flat += parsed.flat;
        }
      }
      const scaled = { dice: new Map(), flat: 0 };
      for (const [sides, count] of totalStatFormula.dice) {
        scaled.dice.set(sides, Math.ceil(count * multiplier - Number.EPSILON * Math.abs(count * multiplier) * 4));
      }
      scaled.flat = Math.ceil(totalStatFormula.flat * multiplier - Number.EPSILON * Math.abs(totalStatFormula.flat * multiplier) * 4);
      for (const [sides, count] of weaponFormula.dice) {
        scaled.dice.set(sides, (scaled.dice.get(sides) || 0) + count);
      }
      scaled.flat += weaponFormula.flat;

      return {
        amount: formatDiceFormula(scaled),
        weaponModifier: hasWeaponModifier ? formatDiceFormula(weaponFormula) : ""
      };
    }

    function enhancedAbilityEffectBonus(character, ability, configuration, stat, bonus) {
      const base = parseDiceFormula(bonus);
      if (!base) return bonus;
      const enhanced = { dice: new Map(base.dice), flat: base.flat };
      const configuredEnhancements = configuration.enhancements || ability.enhancements || [];
      if (!Array.isArray(configuredEnhancements)) {
        console.error(`Invalid enhancements configured for ${ability.name}.`, configuredEnhancements);
        return bonus;
      }
      const additions = configuredEnhancements
        .filter((entry) => entry?.stat === stat)
        .map((entry) => parseDiceFormula(entry.bonus));
      if (additions.some((addition) => !addition)) {
        console.error(`Invalid enhancement bonus configured for ${ability.name}.`, configuredEnhancements);
        return bonus;
      }
      let isEnhanced = false;
      for (const enhancerCharacter of CHARACTERS) {
        for (const enhancer of allCharacterAbilities(enhancerCharacter)) {
          for (const enhancerConfiguration of [enhancer, ...(enhancer.variants || [])]) {
            const rule = enhancerConfiguration.enhancement;
            if (
              !enhancerConfiguration.tags?.includes("enhancement") ||
              !isPassiveConfiguration(enhancerConfiguration)
            ) continue;
            const validRule = rule &&
              ["self", "others", "party", "tagged", "self-and-tagged"].includes(rule.target) &&
              Array.isArray(rule.targetTags) &&
              rule.targetTags.length > 0 &&
              rule.targetTags.every((tag) => typeof tag === "string" && tag.trim()) &&
              (!["tagged", "self-and-tagged"].includes(rule.target) ||
                (Array.isArray(rule.tags) && rule.tags.length > 0 && rule.tags.every((tag) => typeof tag === "string" && tag.trim())));
            if (!validRule) {
              console.error(`Invalid enhancement configuration for ${enhancer.name}.`, rule);
              continue;
            }
            if (
              !abilityHasAnyTag(ability, rule.targetTags, configuration) ||
              !statEffectTargets(rule, enhancerCharacter).includes(character.id)
            ) continue;
            isEnhanced = true;
          }
        }
      }
      if (!isEnhanced) return bonus;
      for (const addition of additions) {
        for (const [sides, count] of addition.dice) {
          enhanced.dice.set(sides, (enhanced.dice.get(sides) || 0) + count);
        }
        enhanced.flat += addition.flat;
      }
      return formatDiceFormula(enhanced);
    }

    function equipmentAttackSummary(character, item, attack) {
      const result = equipmentAttackResult(character, item, attack);
      if (!result) return "Invalid damage formula";
      return result.weaponModifier
        ? `${result.amount} (includes ${item.name} ${result.weaponModifier})`
        : result.amount;
    }

    function isValidStatEffect(effect, character, isToggleable = false) {
      return Boolean(
        effect &&
        typeof effect.id === "string" &&
        effect.id.trim() &&
        Object.hasOwn(character.stats, effect.stat) &&
        ((typeof effect.bonus === "string" && effect.bonus.trim()) ||
          (typeof effect.bonus === "number" && Number.isFinite(effect.bonus))) &&
        (isToggleable
          ? effect.duration === undefined || (Number.isInteger(effect.duration) && effect.duration > 0)
          : Number.isInteger(effect.duration) && effect.duration > 0) &&
        ["self", "others", "party", "tagged", "self-and-tagged"].includes(effect.target) &&
        (!["tagged", "self-and-tagged"].includes(effect.target) ||
          (Array.isArray(effect.tags) && effect.tags.length > 0 && effect.tags.every((tag) => typeof tag === "string" && tag.trim())))
      );
    }

    function isValidAbilityUpkeep(ability) {
      return ability.upkeep === undefined || (
        ability.upkeep &&
        typeof ability.upkeep === "object" &&
        !Array.isArray(ability.upkeep) &&
        Object.entries(ability.upkeep).every(([resource, amount]) =>
          ["mana", "stamina"].includes(resource) &&
          Number.isSafeInteger(amount) &&
          amount >= 0
        )
      );
    }

    function isValidManaTideConfiguration(configuration) {
      return Boolean(
        configuration &&
        Number.isSafeInteger(configuration.durationRounds) &&
        configuration.durationRounds > 1 &&
        Number.isFinite(configuration.maxRecovery) &&
        configuration.maxRecovery >= 0 &&
        Number.isFinite(configuration.manaPerRecovery) &&
        configuration.manaPerRecovery > 0 &&
        configuration.growth === "quadratic"
      );
    }

    function abilityHasAnyTag(ability, tags, configuration = null) {
      const expectedTags = new Set((tags || []).filter((tag) => typeof tag === "string").map((tag) => tag.toLowerCase()));
      return [...(ability.tags || []), ...(configuration?.tags || [])]
        .some((tag) => typeof tag === "string" && expectedTags.has(tag.toLowerCase()));
    }

    function getAbilityCostModifiers(character, resource, targetAbility = null) {
      return CHARACTERS.flatMap((sourceCharacter) =>
        allCharacterAbilities(sourceCharacter).flatMap((ability) =>
          [ability, ...(ability.variants || [])].flatMap((configuration) => {
            if (!isPassiveConfiguration(configuration)) return [];
            return (configuration.costEffects || [])
              .filter((effect) =>
                Number.isSafeInteger(effect[resource]) &&
                effect[resource] > 0 &&
                statEffectTargets(effect, sourceCharacter).includes(character.id) &&
                (!effect.abilityTags || (targetAbility && abilityHasAnyTag(targetAbility, effect.abilityTags)))
              )
              .map((effect) => ({ amount: effect[resource], source: ability.name }));
          })
        )
      );
    }

    function getEffectiveAbilityCost(character, resource, cost, ability = null) {
      const modifiers = getAbilityCostModifiers(character, resource, ability);
      const reduction = modifiers.reduce((total, modifier) => total + modifier.amount, 0);
      if (typeof cost !== "number" || !Number.isFinite(cost)) {
        return { cost, reduction, sources: [...new Set(modifiers.map((modifier) => modifier.source))] };
      }
      return {
        cost: Math.max(0, cost - reduction),
        reduction,
        sources: [...new Set(modifiers.map((modifier) => modifier.source))]
      };
    }

    function getEffectiveAbilityUpkeep(character, resource, cost, ability = null) {
      const modifiers = getAbilityCostModifiers(character, resource, ability);
      const reduction = modifiers.reduce((total, modifier) => total + modifier.amount / 10 * 6, 0);
      return {
        cost: Math.max(0, cost - reduction),
        reduction,
        sources: [...new Set(modifiers.map((modifier) => modifier.source))]
      };
    }

    function manaTideAbility() {
      for (const character of CHARACTERS) {
        const ability = character.abilities.find((entry) => entry.manaTide);
        if (ability) return { character, ability };
      }
      return null;
    }

    function manaTideRecoveryBonus(character) {
      const configured = manaTideAbility()?.ability.manaTide;
      if (!isValidManaTideConfiguration(configured) || !state.manaTide?.active) return 0;
      const duration = configured.durationRounds;
      const progress = Math.max(0, Math.min(duration - 1, state.manaTide.roundsElapsed));
      // Completed party rounds drive a quadratic ramp from zero to the configured maximum.
      const ramp = configured.maxRecovery * (progress / (duration - 1)) ** 2;
      const spent = character.id === "Pat" ? 0 : state.manaTide.spentByCharacter?.[character.id] || 0;
      return ramp + spent / configured.manaPerRecovery;
    }

    function recordManaSpent(characterId, amount) {
      if (!state.manaTide?.active || !Number.isFinite(amount) || amount <= 0) return;
      state.manaTide.spentByCharacter ??= {};
      const previous = characterId === "Pat" ? 0 : state.manaTide.spentByCharacter[characterId] || 0;
      state.manaTide.spentByCharacter[characterId] = Math.round((previous + amount) * 1e6) / 1e6;
    }

    function effectiveRecovery(character, stat) {
      const bonus = getStatModifiers(character, stat).reduce((total, modifier) => {
        const parsed = parseDiceFormula(modifier.bonus);
        if (!parsed || parsed.dice.size) {
          console.error(`${statDisplayName(stat)} modifier from ${modifier.source} must be a flat numeric value to affect recovery.`, modifier);
          return total;
        }
        return total + parsed.flat;
      }, 0);
      return Math.max(0, character.stats[stat] + bonus);
    }

    function hasUnlockedPotential(character) {
      return Array.isArray(character.tags) && character.tags.includes("unlocked-potential");
    }

    function minimumResourceValue(character, resource) {
      return hasUnlockedPotential(character) && ["mana", "stamina"].includes(resource)
        ? -Number.MAX_SAFE_INTEGER
        : 0;
    }

    function hasNegativeCastingResource(character) {
      const resources = state.characters[character.id].resources;
      return resources.mana < 0 || resources.stamina < 0;
    }

    function deactivateToggleAbilitiesForExhaustedCharacter(character) {
      if (!hasUnlockedPotential(character) || !hasNegativeCastingResource(character)) return [];
      const progress = state.characters[character.id];
      const deactivated = [];
      for (const ability of allCharacterAbilities(character)) {
        for (const configuration of [ability, ...(ability.variants || [])]) {
          if (configuration.activeMode !== "toggle") continue;
          const stateKey = abilityStateKey(ability, configuration === ability ? null : configuration);
          if (!progress.activeAbilities?.[stateKey]) continue;
          progress.activeAbilities[stateKey] = false;
          deactivated.push(ability.name);
        }
      }
      return deactivated;
    }

    function canPayAbilityResources(character, costs, effects) {
      if (hasUnlockedPotential(character) && hasNegativeCastingResource(character)) return false;
      const projected = new Map(CHARACTERS.map((entry) => [
        entry.id,
        { mana: state.characters[entry.id].resources.mana, stamina: state.characters[entry.id].resources.stamina }
      ]));
      const affectedCharacterIds = new Set([character.id]);
      const ownResources = projected.get(character.id);
      for (const resource of ["mana", "stamina"]) {
        if (!hasUnlockedPotential(character) && ownResources[resource] < costs[resource]) return false;
        ownResources[resource] -= costs[resource];
      }

      for (const effect of effects) {
        if (!["mana", "stamina"].includes(effect.resource)) continue;
        for (const targetId of statEffectTargets(effect, character)) {
          affectedCharacterIds.add(targetId);
          const target = characterById(targetId);
          const targetResources = projected.get(targetId);
          targetResources[effect.resource] = Math.max(
            minimumResourceValue(target, effect.resource),
            Math.min(
              target.resources[effect.resource],
              targetResources[effect.resource] + effect.amount
            )
          );
        }
      }

      return [...affectedCharacterIds].every((targetId) => {
        const target = characterById(targetId);
        return ["mana", "stamina"].every((resource) => {
          const value = projected.get(target.id)[resource];
          return value >= 0 || hasUnlockedPotential(target);
        });
      });
    }

    function getStatModifiers(character, stat, includeEquipment = true) {
      const activeModifiers = state.activeStatEffects.flatMap((activeEffect) => {
        if (activeEffect.targetCharacterId !== character.id) return [];
        const effect = findConfiguredStatEffect(
          activeEffect.sourceCharacterId,
          activeEffect.sourceAbilityId,
          activeEffect.sourceConfigurationId,
          activeEffect.effectId
        );
        if (!effect || effect.stat !== stat) return [];
        const source = characterById(activeEffect.sourceCharacterId);
        const ability = allCharacterAbilities(source).find((entry) => entry.id === activeEffect.sourceAbilityId);
        const configuration = [ability, ...(ability.variants || [])]
          .find((entry) => entry.id === activeEffect.sourceConfigurationId) || ability;
        return [{
          bonus: enhancedAbilityEffectBonus(character, ability, configuration, stat, effect.bonus),
          source: ability.name,
          detail: `${activeEffect.remainingTurns} turn${activeEffect.remainingTurns === 1 ? "" : "s"} remaining`
        }];
      });
      const passiveModifiers = CHARACTERS.flatMap((sourceCharacter) =>
        allCharacterAbilities(sourceCharacter).flatMap((ability) =>
          [ability, ...(ability.variants || [])].flatMap((configuration) => {
            if (!isPassiveConfiguration(configuration)) return [];
            return (configuration.statEffects || [])
              .filter((effect) => effect.stat === stat && statEffectTargets(effect, sourceCharacter).includes(character.id))
              .map((effect) => ({
                bonus: enhancedAbilityEffectBonus(sourceCharacter, ability, configuration, stat, effect.bonus),
                source: ability.name,
                detail: "Passive effect"
              }));
          })
        )
      );
      const activeToggleModifiers = CHARACTERS.flatMap((sourceCharacter) => {
        const progress = state.characters[sourceCharacter.id];
        return allCharacterAbilities(sourceCharacter).flatMap((ability) =>
          [ability, ...(ability.variants || [])].flatMap((configuration) => {
            const stateKey = abilityStateKey(ability, configuration === ability ? null : configuration);
            if (configuration.activeMode !== "toggle" || !progress.activeAbilities?.[stateKey]) return [];
            return (configuration.statEffects || [])
              .filter((effect) => effect.stat === stat && statEffectTargets(effect, sourceCharacter).includes(character.id))
              .map((effect) => ({
                bonus: enhancedAbilityEffectBonus(sourceCharacter, ability, configuration, stat, effect.bonus),
                source: ability.name,
                detail: "Active"
              }));
          })
        );
      });
      const tideBonus = stat === "manaRecovery" ? manaTideRecoveryBonus(character) : 0;
      const manaTideModifiers = tideBonus > 0
        ? [{ bonus: String(Number(tideBonus.toFixed(4))), source: "Mana Tide", detail: "Active" }]
        : [];
      const equippedItemIds = new Set(state.characters[character.id].equippedEquipment || []);
      const equipmentModifiers = includeEquipment
        ? (character.equipment || [])
          .filter((item) => equippedItemIds.has(item.id))
          .flatMap((item) => (item.statEffects || [])
            .filter((effect) => effect.stat === stat && typeof effect.bonus === "string")
            .map((effect) => ({ bonus: effect.bonus, source: item.name, detail: "Equipped" })))
        : [];
      const afflictionModifiers = (state.activeAfflictions || [])
        .filter((entry) => entry.characterId === character.id)
        .flatMap((entry) => {
          const affliction = AFFLICTION_GLOSSARY[entry.afflictionId];
          return (affliction?.statEffects || []).flatMap((effect) => {
            if (effect.stat !== stat || typeof effect.bonus !== "string") return [];
            const bonus = effect.perStack === false ? effect.bonus : scaledDiceFormula(effect.bonus, entry.stacks);
            if (!bonus) {
              console.error(`Invalid stat effect on ${affliction.name}.`, effect);
              return [];
            }
            const duration = entry.remainingTurns === null ? "Does not expire" : `${entry.remainingTurns} turns remaining`;
            return [{
              bonus,
              source: affliction.name,
              detail: `${entry.stacks} stack${entry.stacks === 1 ? "" : "s"} · ${duration}`
            }];
          });
        });
      return [...activeModifiers, ...passiveModifiers, ...activeToggleModifiers, ...manaTideModifiers, ...equipmentModifiers, ...afflictionModifiers];
    }

    function renderStatValue(character, stat) {
      const modifiers = getStatModifiers(character, stat);
      const baseValue = escapeHtml(character.stats[stat]);
      if (!modifiers.length) return baseValue;
      const bonusText = modifiers.map((modifier) => {
        const bonus = modifier.bonus;
        const displayBonus = /^[+-]/.test(bonus) ? bonus : `+${bonus}`;
        return `<span class="stat-modifier" title="${escapeHtml(modifier.source)} · ${escapeHtml(modifier.detail)}">${escapeHtml(displayBonus)}</span>`;
      }).join("");
      return `${baseValue}${bonusText}`;
    }

    // Merge configured campaign progress and reject effects that no longer match the code setup.
    function mergeCampaignProgress(parsed) {

      for (const character of CHARACTERS) {
        const savedCharacter = parsed.characters?.[character.id];
        if (savedCharacter?.resources) {
          for (const key of Object.keys(character.resources)) {
            if (Number.isFinite(savedCharacter.resources[key])) {

                minimumResourceValue(character, key),

        if (Array.isArray(savedCharacter?.equippedEquipment)) {

            if (Number.isFinite(cooldown)) {

        }
        if (savedCharacter?.activeTurns) {

        }

              initial.characters[character.id].activeAbilities[key] = savedCharacter.activeAbilities[key] === true;
            }

        }

          for (const ability of allCharacterAbilities(character)) {
            for (const configuration of [ability, ...(ability.variants || [])]) {
              const key = abilityStateKey(ability, configuration === ability ? null : configuration);
              const recharges = savedCharacter.chargeRecharges[key];
              if (!Array.isArray(recharges) || !Number.isInteger(configuration.charges) || !Number.isInteger(configuration.recharge)) continue;
              initial.characters[character.id].chargeRecharges[key] = recharges
                .filter((turns) => Number.isInteger(turns) && turns > 0 && turns <= configuration.recharge)

            initial.characters[character.id].abilityUsesThisTurn[ability.id] = Number.isInteger(savedUseCount) && savedUseCount >= 0

          const sourceCharacter = characterById(activeEffect.sourceCharacterId);

            .find((entry) => entry.id === activeEffect.sourceAbilityId);
          const effect = findConfiguredStatEffect(

            !Number.isInteger(activeEffect.remainingTurns) ||
            activeEffect.remainingTurns < 1 ||
            activeEffect.remainingTurns > effect.duration
          ) continue;
          initial.activeStatEffects.push({
            id: String(activeEffect.id || ""),
            sourceCharacterId: sourceCharacter.id,
            sourceAbilityId: ability.id,
            sourceConfigurationId: String(activeEffect.sourceConfigurationId || ability.id),
            effectId: effect.id,
            targetCharacterId: targetCharacter.id,
            remainingTurns: activeEffect.remainingTurns
          });
        }
      }
      if (Array.isArray(parsed.activeAfflictions)) {
        initial.activeAfflictions = parsed.activeAfflictions.flatMap((entry) => {
          if (
            !entry || typeof entry !== "object" ||
            !characterById(entry.characterId) ||
            !Object.hasOwn(AFFLICTION_GLOSSARY, entry.afflictionId) ||
            !Number.isSafeInteger(entry.stacks) || entry.stacks < 1 ||
            !(entry.remainingTurns === null || (Number.isSafeInteger(entry.remainingTurns) && entry.remainingTurns > 0))
          ) return [];
          return [{
            id: typeof entry.id === "string" && entry.id ? entry.id : `affliction-${initial.activeAfflictions.length + 1}`,
            characterId: entry.characterId,
            afflictionId: entry.afflictionId,
            stacks: entry.stacks,
            remainingTurns: entry.remainingTurns,
            source: typeof entry.source === "string" ? entry.source.slice(0, 160) : "Unknown source"
          }];
        });
      }
      const highestAfflictionSequence = initial.activeAfflictions.reduce((highest, entry) => {
        const match = /^affliction-(\d+)$/.exec(entry.id);
        return match ? Math.max(highest, Number(match[1])) : highest;
      }, 0);
      initial.afflictionSequence = Math.max(
        Number.isSafeInteger(parsed.afflictionSequence) && parsed.afflictionSequence >= 0 ? parsed.afflictionSequence : 0,
        highestAfflictionSequence,
        initial.activeAfflictions.length
      );
      if (Number.isSafeInteger(parsed.crystalSequence) && parsed.crystalSequence >= 0) {
        initial.crystalSequence = parsed.crystalSequence;
      }
      for (const character of CHARACTERS) {
        const savedCharacter = parsed.characters?.[character.id];
        if (!savedCharacter?.crystals || typeof savedCharacter.crystals !== "object") continue;
        for (const ability of allCharacterAbilities(character)) {
          const configuration = ability.crystalSummon;
          const savedCrystals = savedCharacter.crystals[ability.id];
          if (
            !configuration ||
            !Number.isSafeInteger(configuration.max) ||
            configuration.max < 1 ||
            !Number.isSafeInteger(configuration.disableTurns) ||
            configuration.disableTurns < 1 ||
            !Array.isArray(savedCrystals)
          ) continue;
          initial.characters[character.id].crystals[ability.id] = savedCrystals
            .filter((crystal) =>
              crystal &&
              typeof crystal.id === "string" &&
              Number.isInteger(crystal.disabledTurns) &&
              crystal.disabledTurns >= 0 &&
              crystal.disabledTurns <= configuration.disableTurns
            )
            .slice(0, configuration.max)
            .map((crystal) => ({ id: crystal.id, disabledTurns: crystal.disabledTurns }));
          for (const crystal of initial.characters[character.id].crystals[ability.id]) {
            const match = /^mana-crystal-(\d+)$/.exec(crystal.id);
            if (match) initial.crystalSequence = Math.max(initial.crystalSequence, Number(match[1]));
          }
        }
      }
      const savedManaTide = parsed.manaTide;
      const configuredManaTide = manaTideAbility();
      if (
        savedManaTide?.active === true &&
        configuredManaTide &&
        isValidManaTideConfiguration(configuredManaTide.ability.manaTide) &&
        characterById(savedManaTide.sourceCharacterId) &&
        Number.isInteger(savedManaTide.roundsElapsed) &&
        savedManaTide.roundsElapsed >= 0 &&
        savedManaTide.roundsElapsed < configuredManaTide.ability.manaTide.durationRounds
      ) {
        initial.manaTide = {
          active: true,
          sourceCharacterId: savedManaTide.sourceCharacterId,
          roundsElapsed: savedManaTide.roundsElapsed,
          spentByCharacter: Object.fromEntries(CHARACTERS.flatMap((character) => {
            const spent = savedManaTide.spentByCharacter?.[character.id];
            return Number.isFinite(spent) && spent >= 0 && spent < Number.MAX_SAFE_INTEGER
              ? [[character.id, Math.round(spent * 1e6) / 1e6]]
              : [];
          }))
        };
      }
      if (Array.isArray(parsed.equipmentAttackLog)) {
        initial.equipmentAttackLog = parsed.equipmentAttackLog.flatMap((entry) => {
          const character = characterById(entry?.characterId);
          const item = character?.equipment?.find((equipment) =>
            equipment.id === entry?.equipmentId && equipment.type === "weapon"
          );
          const attack = item && equipmentAttacks(item).find((configuredAttack) =>
            configuredAttack.id === (entry?.attackId || "default")
          );
          return attack && Number.isInteger(entry.turn) && entry.turn > 0
            ? [{
              characterId: character.id,
              equipmentId: item.id,
              attackId: attack.id,
              turn: entry.turn,
              ...(typeof entry.damageSummary === "string" ? { damageSummary: entry.damageSummary.slice(0, 500) } : {})
            }]
            : [];
        }).slice(-10);
      }
      initial.turn = Number.isInteger(parsed.turn) && parsed.turn > 0 ? parsed.turn : 1;
      initial.turnIndex = Number.isInteger(parsed.turnIndex) ? Math.max(0, parsed.turnIndex) % CHARACTERS.length : 0;
      initial.selectedId = CHARACTERS.some((character) => character.id === parsed.selectedId) ? parsed.selectedId : CHARACTERS[0].id;
      initial.view = ["sheet", "Afflictions"].includes(parsed.view) ? parsed.view : "overview";
      if (parsed.variantSelection && typeof parsed.variantSelection === "object") {
        for (const character of CHARACTERS) {
          for (const ability of allCharacterAbilities(character)) {
            const selectedVariantId = parsed.variantSelection[character.id]?.[ability.id];
            if ((ability.variants || []).some((variant) => variant.id === selectedVariantId)) {
              initial.variantSelection[character.id] ??= {};
              initial.variantSelection[character.id][ability.id] = selectedVariantId;
            }
          }
        }
      }
      return initial;
    }

    // Session state remains usable on a local file; Firebase sync is enabled after config is added.
    function loadCampaign() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? mergeCampaignProgress(JSON.parse(saved)) : createInitialCampaign();
    }

    let state = loadCampaign();
    let toastTimer;
    let resourceAdjustmentAmount = "1";
    let remoteCampaignRef = null;
    let remoteSet = null;
    let applyingRemoteState = false;
    let remoteWriteQueue = Promise.resolve();

    function saveCampaign() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (remoteCampaignRef && !applyingRemoteState) queueRemoteSave();
    }

    function setSyncStatus(message, isError = false) {
      document.getElementById("sync-status").textContent = message;
      document.getElementById("top-sync-status").textContent = message;
      for (const id of ["sync-dot", "top-sync-dot"]) {
        const dot = document.getElementById(id);
        dot.style.background = isError ? "var(--red)" : message === "Synced" ? "var(--green)" : "var(--gold)";
      }
    }

    // Translate common Firebase setup errors into actions visible to the campaign owner.
    function firebaseErrorMessage(error) {
      switch (error?.code) {
        case "auth/configuration-not-found":
          return "Enable Anonymous sign-in in Firebase Authentication.";
        case "auth/unauthorized-domain":
          return "Add this site to Firebase Authentication's authorized domains.";
        case "PERMISSION_DENIED":
        case "database/permission-denied":
          return "Firebase Database rules denied access. Check authenticated read/write rules.";
        default:
          if (error instanceof TypeError && /fetch|module/i.test(error.message)) {
            return "Firebase SDK could not load. Open the app on GitHub Pages (HTTPS) or localhost, not as a file.";
          }
          return "Firebase sync could not connect. Check the browser console for details.";
      }
    }

    // View and selected character are device-local; game progress and resources are shared.
    function sharedCampaignSnapshot() {
      return {
        turn: state.turn,
        turnIndex: state.turnIndex,
        activeStatEffects: state.activeStatEffects,
        activeAfflictions: state.activeAfflictions,
        afflictionSequence: state.afflictionSequence,
        equipmentAttackLog: state.equipmentAttackLog,
        manaTide: state.manaTide,
        characters: state.characters
      };
    }

    function queueRemoteSave() {
      if (!remoteCampaignRef || !remoteSet) return;
      const payload = sharedCampaignSnapshot();
      remoteWriteQueue = remoteWriteQueue
        .then(() => remoteSet(remoteCampaignRef, payload))
        .then(() => setSyncStatus("Synced"))
        .catch((error) => {
          console.error("Could not save campaign to Firebase:", error);
          setSyncStatus("Sync error", true);
          notify(`${firebaseErrorMessage(error)} Local changes are still saved.`);
        });
    }

    /*
     * GitHub Pages serves this file but has no database of its own. Add the public
     * Firebase web config above, enable Anonymous Authentication, and create Realtime
     * Database. Before sharing a public page, restrict database rules to your players'
     * Firebase Auth UIDs; a broad "auth != null" rule lets any site visitor write.
     * Firebase web config is public; never put an Admin SDK key or service secret here.
     */
    async function startFirebaseSync() {
      // Browsers restrict Firebase's remote ES modules and auth origins on file:// URLs.
      if (location.protocol === "file:") {
        setSyncStatus("Open via HTTPS to sync");
        return;
      }

      const requiredConfig = ["apiKey", "authDomain", "databaseURL", "projectId", "appId"];
      const missingConfig = requiredConfig.filter((key) =>
        !FIREBASE_CONFIG[key] || FIREBASE_CONFIG[key].startsWith("YOUR_")
      );
      if (missingConfig.length) {
        setSyncStatus(missingConfig.includes("databaseURL") ? "Add database URL" : "Firebase config incomplete");
        return;
      }
      if (!/^https:\/\/[^/]+/.test(FIREBASE_CONFIG.databaseURL)) {
        setSyncStatus("Invalid database URL", true);
        console.error("Firebase Realtime Database URL must be an https URL.");
        return;
      }

      setSyncStatus("Connecting");
      try {
        const [appSdk, authSdk, databaseSdk] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js")
        ]);
        const app = appSdk.initializeApp(FIREBASE_CONFIG);
        const auth = authSdk.getAuth(app);
        await authSdk.signInAnonymously(auth);
        const database = databaseSdk.getDatabase(app);
        remoteCampaignRef = databaseSdk.ref(database, FIREBASE_CAMPAIGN_PATH);
        remoteSet = databaseSdk.set;
        setSyncStatus("Connecting");
        databaseSdk.onValue(remoteCampaignRef, (snapshot) => {
          if (!snapshot.exists()) {
            queueRemoteSave();
            return;
          }
          const localView = state.view;
          const localSelection = state.selectedId;
          const localVariants = state.variantSelection;
          applyingRemoteState = true;
          state = {
            ...mergeCampaignProgress(snapshot.val()),
            view: localView,
            selectedId: localSelection,
            variantSelection: localVariants
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          applyingRemoteState = false;
          render();
          setSyncStatus("Synced");
        }, (error) => {
          console.error("Firebase campaign listener failed:", error);
          setSyncStatus("Sync error", true);
          notify(firebaseErrorMessage(error));
        });
      } catch (error) {
        console.error("Firebase campaign sync could not start:", error);
        remoteCampaignRef = null;
        remoteSet = null;
        setSyncStatus("Sync error", true);
        notify(`${firebaseErrorMessage(error)} Local saving is still available.`);
      }
    }

    function characterById(id) {
      return CHARACTERS.find((character) => character.id === id);
    }

    function getCurrentCharacter() {
      return CHARACTERS[state.turnIndex];
    }

    function getSelectedCharacter() {
      return characterById(state.selectedId);
    }

    function characterSummary(character) {
      return `${character.race} · ${character.magicspecialty} · ${character.rank}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function avatarStyle(character, extraClass = "") {
      return `<div class="avatar ${extraClass}" style="--avatar-color:${character.color};--avatar-bg:${character.avatarBg};--avatar-border:${character.color}55" aria-hidden="true">${escapeHtml(character.initials)}</div>`;
    }

    function resourcePercent(character, resource) {
      return Math.max(0, Math.min(100, (state.characters[character.id].resources[resource] / character.resources[resource]) * 100));
    }

    function resourceBar(character, resource, label) {
      const current = state.characters[character.id].resources[resource];
      const maximum = character.resources[resource];
      return `<div class="bar-line">
        <span class="bar-name">${label}</span>
        <div class="bar-track" aria-label="${label} ${current} of ${maximum}"><div class="bar-fill ${resource}" style="width:${resourcePercent(character, resource)}%"></div></div>
        <span class="bar-value">${current} <span style="color:var(--faint)">/ ${maximum}</span></span>
      </div>`;
    }

    function renderRoster() {
      document.getElementById("roster-count").textContent = CHARACTERS.length;
      document.getElementById("roster").innerHTML = CHARACTERS.map((character) => {
        const isCurrent = getCurrentCharacter().id === character.id;
        return `<button class="nav-button ${state.selectedId === character.id && state.view === "sheet" ? "active" : ""}" data-character="${character.id}">
          ${avatarStyle(character)}
          <span class="roster-person"><span class="roster-name">${escapeHtml(character.name)}</span><span class="roster-class">${escapeHtml(characterSummary(character))}</span></span>
          ${isCurrent ? '<span class="turn-indicator">Turn</span>' : ""}
        </button>`;
      }).join("");
    }

    function renderSummary() {
      const allResources = CHARACTERS.flatMap((character) => {
        const current = state.characters[character.id].resources;
        return Object.keys(character.resources).map((resource) => current[resource] / character.resources[resource]);
      });
      const average = Math.round((allResources.reduce((sum, value) => sum + value, 0) / allResources.length) * 100);
      const totalAbilities = CHARACTERS.reduce((total, character) => total + allCharacterAbilities(character).length, 0);
      const current = getCurrentCharacter();
      return `<div class="summary-grid">
        <article class="summary-card"><div class="summary-top"><span class="summary-label">Party members</span><span class="summary-icon">♙</span></div><div class="summary-value">${CHARACTERS.length}</div><div class="summary-foot">Adventurers in the party</div></article>
        <article class="summary-card"><div class="summary-top"><span class="summary-label">Party rotation</span><span class="summary-icon">◷</span></div><div class="summary-value">${state.turn}</div><div class="summary-foot">Advances after everyone takes a turn</div></article>
        <article class="summary-card"><div class="summary-top"><span class="summary-label">Next in order</span><span class="summary-icon">➜</span></div><div class="summary-value" style="font-size:20px">${escapeHtml(current.name.split(" ")[0])}</div><div class="summary-foot">${escapeHtml(characterSummary(current))}</div></article>
        <article class="summary-card"><div class="summary-top"><span class="summary-label">Party resources</span><span class="summary-icon">◈</span></div><div class="summary-value">${average}<span style="font:12px system-ui;color:var(--muted)">%</span></div><div class="summary-foot">${totalAbilities} abilities ready to track</div></article>
      </div>`;
    }

    function renderPlayerCard(character) {
      const current = getCurrentCharacter().id === character.id;
      return `<article class="player-card ${current ? "current-turn" : ""}" data-open-character="${character.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(character.name)}'s character sheet">
        <div class="player-card-head">
          ${avatarStyle(character)}
          <div class="player-card-info"><div class="player-card-name">${escapeHtml(character.name)}</div><div class="player-card-class">${escapeHtml(characterSummary(character))}</div></div>
          ${current ? '<span class="turn-tag">CURRENT TURN</span>' : ""}
        </div>
        <div class="card-bars">
          ${resourceBar(character, "health", "Health")}
          ${resourceBar(character, "mana", "Mana")}
          ${resourceBar(character, "stamina", "Stamina")}
        </div>
        <div class="essence-list card-essences" aria-label="Essences">${character.essences.map((essence) => `<span class="essence-chip">${escapeHtml(essence)}</span>`).join("")}</div>
        <div class="quick-stats">
          <div class="quick-stat"><b>${renderStatValue(character, "physicalAttack")}</b><span>Phys. atk</span></div>
          <div class="quick-stat"><b>${renderStatValue(character, "magic")}</b><span>Magic</span></div>
          <div class="quick-stat"><b>${renderStatValue(character, "speed")}</b><span>Speed</span></div>
        </div>

    function turnBanner() {
      const current = getCurrentCharacter();
      return `<div class="turn-banner">
        <div class="turn-left"><div class="turn-symbol" aria-hidden="true">◷</div><div>
          <div class="turn-label">It is their turn</div><div class="turn-player">${escapeHtml(current.name)} <span class="turn-meta">· ${escapeHtml(characterSummary(current))}</span></div>
        </div></div>
        <button class="button primary" data-action="end-turn">End turn <span aria-hidden="true">→</span></button>
      </div>`;
