    function renderOverview() {
      return `<div class="page-head"><div><div class="eyebrow">Campaign dashboard</div><h1>The party at a glance</h1><p class="subtitle">A clear view of your adventurers, their resources, and what comes next.</p></div><button class="button" data-action="confirm-reset">↻ <span>Reset session</span></button></div>
        ${turnBanner()}
        ${renderSummary()}
        <section>
          <div class="section-head"><div class="section-title">Adventuring party</div><div class="section-helper">Select a character to open their full sheet</div></div>
          <div class="player-grid">${CHARACTERS.map(renderPlayerCard).join("")}</div>
        </section>`;
    }

    function resourceControl(character, key, label) {
      const current = state.characters[character.id].resources[key];
      const maximum = character.resources[key];
      return `<div class="resource-row">
        <div class="resource-title">${label}<small>Max ${maximum}</small></div>
        <div class="resource-track" aria-label="${label} ${current} of ${maximum}"><div class="resource-fill ${key}" style="width:${resourcePercent(character, key)}%"></div></div>
        <div class="resource-controls">
          <button class="mini-button" data-resource="${key}" data-delta="-1" aria-label="Decrease ${label} by adjustment amount">−</button>
          <span class="resource-number">${current} / ${maximum}</span>
          <button class="mini-button" data-resource="${key}" data-delta="1" aria-label="Increase ${label} by adjustment amount">+</button>
        </div>
      </div>`;
    }

    function statTile(character, stat, label) {
      return `<div class="stat-tile"><div class="stat-value">${renderStatValue(character, stat)}</div><div class="stat-label">${escapeHtml(label)}</div></div>`;
    }

    // Keep the requested stat pairings together as columns, not row-major grid cells.
    function renderCoreStats(character) {
      const columns = [
        [["manaRecovery", "Mana recovery / turn"], ["staminaRecovery", "Stamina recovery / turn"]],
        [["physicalAttack", "Physical attack"], ["damageResistance", "Damage resistance"]],
        [["magic", "Magic"], ["magicResistance", "Magic resistance"]],
        [["reflexes", "Reflexes"], ["speed", "Speed"]]
      ];
      return `<div class="stat-columns">${columns.map((column) =>
        `<div class="stat-column">${column.map(([stat, label]) => statTile(character, stat, label)).join("")}</div>`
      ).join("")}</div>`;
    }

    // A configured summary wins; otherwise the first sentence (capped for the compact view) is used.
    function abilitySummary(ability) {
      if (ability.summary) return ability.summary;
      const firstSentence = String(ability.description || "").split(/(?<=[.!?])\s+/)[0];
      return firstSentence.length > 140 ? `${firstSentence.slice(0, 137).trimEnd()}...` : firstSentence;
    }

    function renderDescriptionWithAfflictions(description) {
      const text = String(description || "");
      const tokenPattern = /\[([^\]]+)\]/g;
      let output = "";
      let previousIndex = 0;
      for (const match of text.matchAll(tokenPattern)) {
        output += escapeHtml(text.slice(previousIndex, match.index));
        const term = match[1].trim();
        const key = term.toLowerCase();
        output += `<button class="affliction-link" data-glossary="${escapeHtml(key)}" type="button">[${escapeHtml(term)}]</button>`;
        previousIndex = match.index + match[0].length;
      }
      return output + escapeHtml(text.slice(previousIndex));
    }

    function renderAbilityDescription(ability) {
      const description = String(ability.description || "");
      return `<details class="ability-description-details">
        <summary><span class="ability-summary">${escapeHtml(abilitySummary(ability))}</span><span class="description-cue" aria-label="Toggle full description"></span></summary>
        <p class="ability-full-description">${renderDescriptionWithAfflictions(description)}</p>
      </details>`;
    }

    // Keep supporting legacy category names while new ability data uses the character's essences.
    function essenceForAbility(character, ability) {
      if (character.essences.includes(ability.category)) return ability.category;
      const legacyCategoryIndex = CATEGORIES.indexOf(ability.category);
      return legacyCategoryIndex >= 0 ? character.essences[legacyCategoryIndex] : null;
    }

    function selectedAbilityFor(character, ability) {
      const selectedId = state.variantSelection[character.id]?.[ability.id];
      const variant = (ability.variants || []).find((entry) => entry.id === selectedId);
      if (!variant) return ability;
      return {
        ...ability,
        ...variant,
        ...(variant.activeVersion ? {
          statEffects: variant.statEffects || [],
          resourceEffects: variant.resourceEffects || [],
          afflictionEffects: variant.afflictionEffects || [],
          manaTide: variant.manaTide
        } : {}),
        tags: [...new Set([...(ability.tags || []), ...(variant.tags || [])])]
      };
    }

    function isPassiveConfiguration(ability) {
      return ability.tags?.includes("passive") && ability.activeVersion !== true;
    }

    function configurableAbilityFields(ability, isRacialGift) {
      return [
        ...(isConfigurableAbilityValue(ability.mana) ? ["mana"] : []),
        ...(isConfigurableAbilityValue(ability.stamina) ? ["stamina"] : []),
        ...(isConfigurableAbilityValue(ability.cooldown) ? ["cooldown"] : []),
        ...(ability.inputFields || []).map((field) => `input:${field.id}`),
        ...(ability.resourceEffects || [])
          .filter((effect) => isConfigurableAbilityValue(effect.amount))
          .map((effect) => `resourceEffect:${effect.id}`)
      ];
    }

    function isConfigurableAbilityValue(value) {
      return typeof value === "string" && value.trim().toUpperCase() === "XX";
    }

    function abilityCostLabel(field, ability) {
      if (field.startsWith("input:")) {
        const inputId = field.slice("input:".length);
        return ability.inputFields?.find((input) => input.id === inputId)?.label || inputId;
      }
      if (field.startsWith("resourceEffect:")) {
        const effectId = field.slice("resourceEffect:".length);
        const effect = (ability.resourceEffects || []).find((entry) => entry.id === effectId);
        const resource = effect?.resource;
        if (resource === "health") return "Health change (negative loses HP)";
        const label = resource ? resource[0].toUpperCase() + resource.slice(1) : "Resource";
        return `${label} change (negative spends)`;
      }
      return ({ mana: "Mana cost", stamina: "Stamina cost", cooldown: "Cooldown (turns)" })[field];
    }

    function renderAbilityRow(character, ability, isRacialGift = false) {
      const progress = state.characters[character.id];
      const selectedAbility = selectedAbilityFor(character, ability);
      const variantId = selectedAbility.id === ability.id ? null : selectedAbility.id;
      const stateKey = variantId ? `${ability.id}::${variantId}` : ability.id;
      const passive = isPassiveConfiguration(selectedAbility);
      const isManaTide = Boolean(selectedAbility.manaTide);
      const manaTideActive = isManaTide && state.manaTide?.active === true;
      const toggleable = selectedAbility.activeMode === "toggle";
      const toggleActive = toggleable && progress.activeAbilities?.[stateKey] === true;
      const invalidUpkeep = toggleable && !isValidAbilityUpkeep(selectedAbility);
      const manaCost = selectedAbility.mana;
      const staminaCost = selectedAbility.stamina;
      const manaEffect = getEffectiveAbilityCost(character, "mana", manaCost, selectedAbility);
      const staminaEffect = getEffectiveAbilityCost(character, "stamina", staminaCost, selectedAbility);
      const cooldown = progress.cooldowns[stateKey] || 0;
      const activeTurns = progress.activeTurns[stateKey] || 0;
      const chargeRecharges = progress.chargeRecharges?.[stateKey] || [];
      const hasCharges = Number.isInteger(selectedAbility.charges) && selectedAbility.charges > 0 &&
        Number.isInteger(selectedAbility.recharge) && selectedAbility.recharge > 0;
      const availableCharges = hasCharges ? Math.max(0, selectedAbility.charges - chargeRecharges.length) : null;
      const crystalSummon = selectedAbility.crystalSummon;
      const crystals = crystalSummon ? progress.crystals?.[ability.id] || [] : [];
      const crystalLimitReached = Boolean(crystalSummon && crystals.length >= crystalSummon.max);
      const usesPerTurn = Number.isInteger(selectedAbility.usesPerTurn) && selectedAbility.usesPerTurn > 0
        ? selectedAbility.usesPerTurn
        : 1;
      const usesThisTurn = progress.abilityUsesThisTurn?.[ability.id] || 0;
      const resourceExhausted = hasUnlockedPotential(character) && hasNegativeCastingResource(character);
      const configurableResourceEffects = (selectedAbility.resourceEffects || []).some((effect) =>
        isConfigurableAbilityValue(effect.amount)
      );
      const resourceCostsConfigurable = isConfigurableAbilityValue(manaCost) ||
        isConfigurableAbilityValue(staminaCost) ||
        configurableResourceEffects;
      const enoughResources = resourceCostsConfigurable || canPayAbilityResources(
        character,
        { mana: manaEffect.cost, stamina: staminaEffect.cost },
        selectedAbility.resourceEffects || []
      );
      const outOfCharges = hasCharges && availableCharges === 0;
      const nextChargeIn = outOfCharges ? Math.min(...chargeRecharges) : null;
      const turnUsesExhausted = usesThisTurn >= usesPerTurn;
      const disabled = passive || invalidUpkeep || (!toggleActive && (
        resourceExhausted || turnUsesExhausted || cooldown > 0 || activeTurns > 0 || outOfCharges || crystalLimitReached || !enoughResources ||
        (isManaTide && manaTideActive)
      ));
      const reason = isManaTide && manaTideActive
        ? `Affects the party · round ${state.manaTide.roundsElapsed + 1}/${selectedAbility.manaTide.durationRounds}`
        : invalidUpkeep ? "Invalid upkeep configuration" : passive || toggleActive ? "" : resourceExhausted ? "Too exhausted to cast: mana and stamina must be nonnegative" : turnUsesExhausted ? "Uses for this turn spent" : activeTurns > 0 ? `Active for ${activeTurns} more turn${activeTurns === 1 ? "" : "s"}` : cooldown > 0 ? `Ready in ${cooldown} turn${cooldown === 1 ? "" : "s"}` : crystalLimitReached ? `Maximum of ${crystalSummon.max} crystals summoned` : outOfCharges ? `Next use in ${nextChargeIn} turn${nextChargeIn === 1 ? "" : "s"}` : !enoughResources ? "Not enough mana or stamina" : "";
      const manaTooltip = manaEffect.sources.length ? ` title="Reduced by ${escapeHtml(manaEffect.sources.join(", "))}"` : "";
      const staminaTooltip = staminaEffect.sources.length ? ` title="Reduced by ${escapeHtml(staminaEffect.sources.join(", "))}"` : "";
      const resourceEffectChips = (selectedAbility.resourceEffects || []).map((effect) => {
        const resource = effect.resource[0].toUpperCase() + effect.resource.slice(1);
        const amount = isConfigurableAbilityValue(effect.amount) ? "set on use" : `+${effect.amount}`;
        return `<span class="cost-chip active-chip">${escapeHtml(resource)} ${escapeHtml(amount)}</span>`;
      }).join("");
      const manaTideChip = isManaTide && manaTideActive
        ? `<span class="cost-chip active-chip">◉ Active · Tide round ${state.manaTide.roundsElapsed + 1}/${selectedAbility.manaTide.durationRounds} · your recovery +${Number(manaTideRecoveryBonus(character).toFixed(2))}/turn</span>`
        : "";
      const upkeepChips = toggleable && isValidAbilityUpkeep(selectedAbility)
        ? Object.entries(selectedAbility.upkeep || {}).filter(([, amount]) => amount > 0).map(([resource, amount]) => {
          const effect = getEffectiveAbilityUpkeep(character, resource, amount, selectedAbility);
          const label = resource[0].toUpperCase() + resource.slice(1);
          const tooltip = effect.sources.length ? ` title="Upkeep reduction: ${escapeHtml(effect.sources.join(", "))}"` : "";
          return `<span class="cost-chip active-chip"${tooltip}>◈ ${escapeHtml(String(effect.cost))} ${label}/turn${effect.reduction ? ` (was ${amount})` : ""}</span>`;
        }).join("")
        : invalidUpkeep ? '<span class="cost-chip cooldown">Invalid upkeep configuration</span>' : "";
      const costs = passive ? '<span class="cost-chip passive-chip">Passive</span>' : [
        isConfigurableAbilityValue(manaCost) ? `<span class="cost-chip"${manaTooltip}>◈ Mana: set on use${manaEffect.reduction ? ` (−${manaEffect.reduction})` : ""}</span>` : manaCost > 0 ? `<span class="cost-chip"${manaTooltip}>◈ ${manaEffect.cost} mana${manaEffect.reduction ? ` (was ${manaCost})` : ""}</span>` : "",
        isConfigurableAbilityValue(staminaCost) ? `<span class="cost-chip stamina"${staminaTooltip}>⌁ Stamina: set on use${staminaEffect.reduction ? ` (−${staminaEffect.reduction})` : ""}</span>` : staminaCost > 0 ? `<span class="cost-chip stamina"${staminaTooltip}>⌁ ${staminaEffect.cost} stamina${staminaEffect.reduction ? ` (was ${staminaCost})` : ""}</span>` : "",
        isConfigurableAbilityValue(selectedAbility.cooldown) ? '<span class="cost-chip cooldown">↻ Cooldown: set on use</span>' : selectedAbility.cooldown > 0 ? `<span class="cost-chip cooldown">↻ ${selectedAbility.cooldown} turn${selectedAbility.cooldown === 1 ? "" : "s"} CD</span>` : "",
        selectedAbility.duration > 0 ? `<span class="cost-chip active-chip">◉ ${selectedAbility.duration} turn${selectedAbility.duration === 1 ? "" : "s"} active</span>` : "",
        toggleActive ? '<span class="cost-chip active-chip">◉ Active until turned off</span>' : "",
        manaTideChip,
        upkeepChips,
        hasCharges ? `<span class="cost-chip cooldown">↻ ${availableCharges}/${selectedAbility.charges} uses${chargeRecharges.length ? ` · next in ${Math.min(...chargeRecharges)} turn${Math.min(...chargeRecharges) === 1 ? "" : "s"}` : ""}</span>` : "",
        crystalSummon ? `<span class="cost-chip active-chip">✧ ${crystals.length}/${crystalSummon.max} crystals</span>` : "",
        usesPerTurn > 1 ? `<span class="cost-chip cooldown">↻ ${usesPerTurn} uses per turn</span>` : "",
        resourceEffectChips
      ].filter(Boolean).join("");
      const crystalControls = crystalSummon ? `<div class="crystal-list">${crystals.map((crystal, index) =>
        `<div class="crystal-item"><span>Crystal ${index + 1} · ${crystal.disabledTurns > 0 ? `disabled (${crystal.disabledTurns} turn${crystal.disabledTurns === 1 ? "" : "s"} left)` : "active"}</span><div class="crystal-actions">${crystal.disabledTurns > 0
          ? ""
          : `<button class="button subtle" data-disable-crystal="${escapeHtml(crystal.id)}" data-crystal-ability="${escapeHtml(ability.id)}">Disable for ${crystalSummon.disableTurns} turns</button>`
        }<button class="button subtle" data-dispel-crystal="${escapeHtml(crystal.id)}" data-crystal-ability="${escapeHtml(ability.id)}">Dispel (+50 mana)</button></div></div>`
      ).join("")}</div>` : "";
      const tags = (selectedAbility.tags || []).filter((tag) => tag !== "passive" && !tag.startsWith("variant:"))
        .map((tag) => `<span class="ability-tag">#${escapeHtml(tag)}</span>`).join("");
      const variants = ability.variants || [];
      const chosenVariantId = state.variantSelection[character.id]?.[ability.id] || "";
      const variantControl = variants.length ? `<label><span class="section-helper">Variant </span><select class="variant-select" data-variant-character="${escapeHtml(character.id)}" data-variant-ability="${escapeHtml(ability.id)}" aria-label="${escapeHtml(ability.name)} variant"><option value="">Standard</option>${variants.map((variant) => `<option value="${escapeHtml(variant.id)}" ${variant.id === chosenVariantId ? "selected" : ""}>${escapeHtml(variant.name)}</option>`).join("")}</select></label>` : "";
      const abilityButton = toggleable
        ? `<button class="button ${toggleActive || !disabled ? "primary" : ""}" data-toggle-ability="${escapeHtml(ability.id)}" ${disabled ? "disabled" : ""}>${toggleActive ? "Turn off" : "Activate"}</button>`
        : isManaTide
          ? `<button class="button ${disabled ? "" : "primary"}" data-use-ability="${escapeHtml(ability.id)}" ${disabled ? "disabled" : ""}>${manaTideActive ? "Mana Tide active" : "Begin Mana Tide"}</button>`
        : `<button class="button ${disabled ? "" : "primary"}" data-use-ability="${escapeHtml(ability.id)}" ${disabled ? "disabled" : ""}>${turnUsesExhausted ? "Uses spent this turn" : usesThisTurn > 0 ? `Use again (${usesThisTurn}/${usesPerTurn})` : activeTurns > 0 ? "Active" : cooldown > 0 ? "Cooling down" : isRacialGift ? "Use gift" : "Use ability"}</button>`;
      const attackButtons = abilityAttacks(selectedAbility).map((attack) => {
        const validConfiguration = isValidAttackConfiguration(character, selectedAbility, attack);
        const stats = Array.isArray(attack.stats) ? attack.stats.map(statDisplayName).join(" + ") : "Invalid stats";
        return `<button class="button subtle" title="${escapeHtml(stats)}" data-ability-attack="${escapeHtml(ability.id)}" data-ability-attack-id="${escapeHtml(attack.id)}" ${validConfiguration ? "" : "disabled"}>${escapeHtml(attack.name)}</button>`;
      }).join("");
      return `<div class="ability-row">
        <div>${variantControl}<div class="ability-name">${escapeHtml(ability.name)}</div>${renderAbilityDescription(selectedAbility)}<div class="ability-costs">${costs}</div><div class="ability-tags">${tags}</div>${crystalControls}</div>
        <div class="ability-action">${attackButtons}${passive ? '<span class="passive-label">PASSIVE</span>' : `${abilityButton}${reason ? `<span class="disabled-reason">${reason}</span>` : ""}`}</div>
      </div>`;
    }

    function renderAbilities(character) {
      return `<section class="ability-section">
        <div class="ability-heading"><div><div class="section-title">Abilities by essence</div><div class="section-helper" style="margin-top:5px">Abilities are limited to one use per owner turn unless configured for more. Toggle abilities stay active until turned off; upkeep is charged at the end of each owner turn (6 seconds). Cost reductions apply normally on activation and at one-tenth strength per second to upkeep. Mana Tide recovery ramps for 300 party rounds; each 10 mana actually spent on an ability adds 1/6 recovery per turn for the spender. Values marked “set on use” are entered when activated. Click afflictions for their glossary entry.</div></div><div class="section-helper">${character.abilities.length} personal abilities</div></div>
        <div class="essence-ability-groups">${character.essences.map((essence) => {
          const abilities = character.abilities.filter((ability) => essenceForAbility(character, ability) === essence);
          return `<div class="ability-group">
            <div class="ability-group-head"><span class="category-title">${escapeHtml(essence)}</span><span class="category-count">${abilities.length} abilities</span></div>
            <div class="ability-list">${abilities.length ? abilities.map((ability) => renderAbilityRow(character, ability)).join("") : '<div class="empty-note">No abilities assigned to this essence yet.</div>'}</div>
          </div>`;
        }).join("")}</div>
      </section>`;
    }

    function renderRacialGifts(character) {
      const gifts = character.racialGifts || [];
      if (!gifts.length) return "";
      return `<section class="ability-section racial-gifts-section">
        <div class="ability-heading"><div><div class="section-title">Racial gifts</div><div class="section-helper" style="margin-top:5px">Innate abilities cost no mana or stamina; tag a gift “passive” to apply it continuously without a use button.</div></div><div class="section-helper">${gifts.length} configured</div></div>
        <div class="ability-group"><div class="ability-list">${gifts.map((gift) => renderAbilityRow(character, gift, true)).join("")}</div></div>
      </section>`;
    }

    function renderEquipment(character) {
      const equipment = character.equipment || [];
      const equippedIds = new Set(state.characters[character.id].equippedEquipment || []);
      const rows = equipment.length ? equipment.map((item) => {
        const equipped = equippedIds.has(item.id);
        const effects = (item.statEffects || []).map((effect) => {
          const label = effect.stat.replace(/[A-Z]/g, (letter) => ` ${letter.toLowerCase()}`);
          const bonus = /^[+-]/.test(effect.bonus) ? effect.bonus : `+${effect.bonus}`;
          return `<span class="cost-chip active-chip">${escapeHtml(label)} ${escapeHtml(bonus)}</span>`;
        }).join("");
        const attacks = item.type === "weapon" ? equipmentAttacks(item) : [];
        const needsPartyTarget = (item.afflictionEffects || []).some((effect) =>
          ["selected", "wielder-and-selected"].includes(effect.target)
        );
        const targetPicker = needsPartyTarget
          ? `<label class="section-helper">Target <select class="variant-select" data-equipment-target="${escapeHtml(item.id)}" aria-label="${escapeHtml(item.name)} target">${CHARACTERS.filter((target) => target.id !== character.id).map((target) =>
            `<option value="${escapeHtml(target.id)}">${escapeHtml(target.name)}</option>`
          ).join("")}</select></label>`
          : "";
        const attackOptions = attacks.map((attack) => {
          const validConfiguration = isValidAttackConfiguration(character, item, attack) &&
            (item.afflictionEffects || []).every(isValidWeaponAfflictionEffect);
          return `<div class="equipment-attack-option"><span class="section-helper">${escapeHtml(equipmentAttackSummary(character, item, attack))}</span>${equipped ? `${targetPicker}<button class="button primary" data-equipment-attack="${escapeHtml(item.id)}" data-equipment-attack-id="${escapeHtml(attack.id)}" ${validConfiguration ? "" : "disabled"}>${escapeHtml(attack.name)}</button>` : ""}</div>`;
        }).join("");
        const description = item.description
          ? renderAbilityDescription(item)
          : item.summary ? `<div class="ability-description">${escapeHtml(item.summary)}</div>` : "";
        return `<div class="ability-row equipment-row">
          <div><div class="equipment-title"><span class="ability-name">${escapeHtml(item.name)}</span>${item.type ? `<span class="equipment-type">${escapeHtml(item.type)}</span>` : ""}${equipped ? '<span class="equipment-status">Equipped</span>' : ""}</div>${description}<div class="ability-costs">${effects}</div></div>
          <div class="equipment-actions"><button class="button ${equipped ? "" : "primary"}" data-equipment-toggle="${escapeHtml(item.id)}" aria-pressed="${equipped}">${equipped ? "Unequip" : "Equip"}</button>${equipped ? attackOptions : ""}</div>
        </div>`;
      }).join("") : '<div class="empty-note">No equipment configured for this character yet.</div>';
      const recentAttacks = (state.equipmentAttackLog || []).slice(-5).reverse().map((entry) => {
        const owner = characterById(entry.characterId);
        const item = owner?.equipment?.find((configuredItem) => configuredItem.id === entry.equipmentId);
        const attack = item && equipmentAttacks(item).find((configuredAttack) =>
          configuredAttack.id === (entry.attackId || "default")
        );
        return owner && item && attack
          ? `<div class="equipment-attack-entry">Round ${entry.turn}: ${escapeHtml(owner.name)} uses ${escapeHtml(attack.name)} with ${escapeHtml(item.name)} — ${escapeHtml(entry.damageSummary || equipmentAttackSummary(owner, item, attack))}.</div>`
          : "";
      }).join("");
      return `<section class="ability-section equipment-section">
        <div class="ability-heading"><div><div class="section-title">Equipment</div><div class="section-helper" style="margin-top:5px">Equip items independently. Equipped stat bonuses are applied to this sheet; weapon attacks use the selected stat and modifier and are recorded without damage tracking.</div></div><div class="section-helper">${equipment.length} configured</div></div>
        <div class="ability-group"><div class="ability-list">${rows}</div>${recentAttacks ? `<div class="equipment-attack-log" aria-live="polite">${recentAttacks}</div>` : ""}</div>
      </section>`;
    }

    function renderCharacterCollection(character, field, title) {
      const entries = Array.isArray(character[field]) ? character[field] : [];
      const rows = entries
        .filter((entry) => entry && typeof entry.name === "string")
        .map((entry) => `<div class="ability-row equipment-row">
          <div><div class="ability-name">${escapeHtml(entry.name)}</div>${entry.description ? `<div class="ability-description">${escapeHtml(entry.description)}</div>` : ""}</div>
        </div>`)
        .join("");
      return `<section class="ability-section">
        <div class="ability-heading"><div class="section-title">${escapeHtml(title)}</div><div class="section-helper">${entries.length} configured</div></div>
        <div class="ability-group"><div class="ability-list">${rows || `<div class="empty-note">No ${escapeHtml(title.toLowerCase())} configured for this character yet.</div>`}</div></div>
      </section>`;
    }

    function renderSheet() {
      const character = getSelectedCharacter();
      const next = CHARACTERS[(state.turnIndex + 1) % CHARACTERS.length];
      return `<div class="page-head"><div><div class="eyebrow">Character sheet · ${escapeHtml(character.rank)}</div><h1>${escapeHtml(character.name)}</h1><p class="subtitle">${escapeHtml(characterSummary(character))}</p></div><button class="button" data-action="confirm-reset">↻ <span>Reset session</span></button></div>
        <div class="sheet-layout">
          <div class="sheet-main">
            <div class="identity-card">
              ${avatarStyle(character, "identity-avatar")}
              <div class="identity-info"><div class="identity-name">${escapeHtml(character.name)}</div><div class="identity-sub">${escapeHtml(characterSummary(character))}</div><div class="essence-list">${character.essences.map((essence) => `<span class="essence-chip">${escapeHtml(essence)}</span>`).join("")}</div></div>
              ${getCurrentCharacter().id === character.id ? '<span class="turn-tag">CURRENT TURN</span>' : ""}
            </div>
            <section class="panel resource-panel">
              <div class="section-head" style="margin:0"><div class="section-title">Resources</div><label class="resource-adjustment">Adjust by <input type="number" min="1" step="1" inputmode="numeric" value="${escapeHtml(resourceAdjustmentAmount)}" data-resource-adjustment aria-label="Resource adjustment amount"></label></div>
              <div class="resource-list">
                ${resourceControl(character, "health", "Health")}
                ${resourceControl(character, "mana", "Mana")}
                ${resourceControl(character, "stamina", "Stamina")}
              </div>
            </section>
            <section class="panel stats-panel">
              <div class="section-head" style="margin:0"><div class="section-title">Core stats</div><div class="section-helper">Configured stats</div></div>
              <div class="core-stats">
                ${renderCoreStats(character)}
              </div>
            </section>
          </div>
          <aside class="sheet-aside">
            <section class="panel aside-panel">
              <div class="aside-heading">Turn order</div>
              <div class="next-turn">${avatarStyle(getCurrentCharacter())}<div><div class="next-name">${escapeHtml(getCurrentCharacter().name)}</div><div class="next-label">Current · Round ${state.turn}</div></div></div>
              <div class="next-turn" style="margin-top:12px">${avatarStyle(next)}<div><div class="next-name">${escapeHtml(next.name)}</div><div class="next-label">Up next</div></div></div>
              <div class="turn-actions"><button class="button primary" data-action="end-turn">End ${escapeHtml(character.name.split(" ")[0])}'s turn →</button><button class="button subtle" data-action="confirm-reset">↻ Reset session</button></div>
              <div class="regen-note">Ending the current turn restores mana and stamina, then reduces that character’s cooldowns. Active durations count down on the owner’s turns; cooldowns pause until an effect expires.</div>
            </section>
            <section class="panel aside-panel">
              <div class="aside-heading">Session</div>
              <div class="next-turn"><div class="turn-symbol" style="width:32px;height:32px">◷</div><div><div class="next-name">Round ${state.turn}</div><div class="next-label">Full party rotation counter</div></div></div>
              <div class="regen-note">Progress is saved in this browser automatically. Reset restores the party’s configured starting resources.</div>
            </section>
          </aside>
        </div>
        ${renderRacialGifts(character)}
        ${renderAbilities(character)}
        ${renderEquipment(character)}
        ${renderCharacterCollection(character, "titles", "Titles")}
        ${renderCharacterCollection(character, "inventory", "Inventory")}`;
    }

    function renderBuffs() {
      const characterOptions = CHARACTERS.map((character) =>
        `<option value="${escapeHtml(character.id)}" ${character.id === state.selectedId ? "selected" : ""}>${escapeHtml(character.name)}</option>`
      ).join("");
      const afflictionOptions = Object.entries(AFFLICTION_GLOSSARY).map(([id, entry]) =>
        `<option value="${escapeHtml(id)}">${escapeHtml(entry.name)}</option>`
      ).join("");
      const characterSections = CHARACTERS.map((character) => {
        const entries = state.activeAfflictions.filter((entry) => entry.characterId === character.id);
        const rows = entries.map((entry) => {
          const affliction = AFFLICTION_GLOSSARY[entry.afflictionId];
          const duration = entry.remainingTurns === null ? "No expiry" : `${entry.remainingTurns} turn${entry.remainingTurns === 1 ? "" : "s"} remaining`;
          const source = entry.source ? ` · ${entry.source}` : "";
          return `<div class="affliction-entry">
            <div><div class="affliction-entry-name">${escapeHtml(affliction.name)} <span class="section-helper">×${entry.stacks}</span></div><div class="affliction-entry-detail">${escapeHtml(affliction.description)}<br>${escapeHtml(duration + source)}</div></div>
            <div class="affliction-entry-actions"><button class="mini-button" data-affliction-remove="${escapeHtml(entry.id)}" aria-label="Remove one ${escapeHtml(affliction.name)} stack from ${escapeHtml(character.name)}">−</button><span class="affliction-count">${entry.stacks} stack${entry.stacks === 1 ? "" : "s"}</span><button class="button subtle" data-affliction-clear="${escapeHtml(entry.id)}">Remove</button></div>
          </div>`;
        }).join("");
        return `<section class="affliction-player">
          <div class="affliction-player-head">${avatarStyle(character)}<div class="section-title">${escapeHtml(character.name)}</div><span class="section-helper">${entries.reduce((total, entry) => total + entry.stacks, 0)} active stacks</span></div>
          ${rows || '<div class="empty-note">No active buffs or afflictions.</div>'}
        </section>`;
      }).join("");
      return `<div class="page-head"><div><div class="eyebrow">Campaign effects</div><h1>Buffs &amp; Afflictions</h1><p class="subtitle">Track effects for the whole party. Durations decrease at the end of each affected character’s turn; entries without a duration remain until removed.</p></div></div>
        <section class="ability-section">
          <div class="ability-heading"><div><div class="section-title">Apply an affliction</div><div class="section-helper" style="margin-top:5px">Add or remove stacks for any player. Leave duration blank for a permanent effect.</div></div></div>
          <form class="affliction-form" data-add-affliction>
            <label>Character<select name="characterId">${characterOptions}</select></label>
            <label>Buff or affliction<select name="afflictionId">${afflictionOptions}</select></label>
            <label>Stacks<input type="number" name="stacks" min="1" max="999" step="1" value="1" required></label>
            <label>Duration (turns)<input type="number" name="duration" min="1" max="999" step="1" placeholder="No expiry"></label>
            <button class="button primary" type="submit">Apply</button>
          </form>
        </section>
        <section class="ability-section">
          <div class="ability-heading"><div><div class="section-title">Party effects</div><div class="section-helper" style="margin-top:5px">Stat effects configured on afflictions are reflected on character sheets and the DM overview.</div></div></div>
          ${characterSections}
        </section>`;
    }

    // Re-render all surfaces together so the roster, dashboard, sheet, and turn badge stay in sync.
    function render() {
      document.getElementById("top-turn").textContent = `Round ${state.turn}`;
      document.getElementById("breadcrumb-current").textContent = ({ overview: "DM Overview", sheet: "Character Sheet", buffs: "Buffs & Afflictions" })[state.view];
      document.querySelectorAll("[data-view]").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === state.view);
      });
      document.getElementById("app").innerHTML = ({
        overview: renderOverview,
        sheet: renderSheet,
        buffs: renderBuffs
      })[state.view]();
      renderRoster();
    }

    function notify(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function setResource(characterId, key, delta) {
      const character = characterById(characterId);
      const resources = state.characters[characterId].resources;
      const nextValue = Math.max(0, Math.min(character.resources[key], resources[key] + delta));
      if (nextValue === resources[key]) return;
      resources[key] = nextValue;
      saveCampaign();
      render();
    }

    function selectAbilityVariant(characterId, abilityId, variantId) {
      const character = characterById(characterId);
      const ability = allCharacterAbilities(character).find((entry) => entry.id === abilityId);
      if (!ability || (variantId && !(ability.variants || []).some((variant) => variant.id === variantId))) return;
      state.variantSelection[characterId] ??= {};
      if (variantId) state.variantSelection[characterId][abilityId] = variantId;
      else delete state.variantSelection[characterId][abilityId];
      saveCampaign();
      render();
    }

    function showAbilityCostForm(abilityId, abilityName, fields, ability) {
      const inputs = fields.map((field) => {
        const inputId = field.startsWith("input:") ? field.slice("input:".length) : null;
        const inputConfig = ability.inputFields?.find((entry) => entry.id === inputId);
        const minimum = inputConfig?.min ?? (field.startsWith("resourceEffect:") ? "" : 0);
        return `<label class="ability-cost-input">
          <span>${escapeHtml(abilityCostLabel(field, ability))}</span>
          <input type="number" name="${field}" ${minimum === "" ? "" : `min="${escapeHtml(String(minimum))}"`} step="1" inputmode="numeric" required>
        </label>`;
      }).join("");
      const root = document.getElementById("modal-root");
      root.innerHTML = `<div class="modal-backdrop" data-dismiss-modal>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="ability-cost-title">
          <h2 id="ability-cost-title">${escapeHtml(abilityName)} · Set values</h2>
          <p>Enter the requested values for this use. Active cost-reduction effects are applied before resources are spent.</p>
          <form data-configurable-ability="${escapeHtml(abilityId)}">
            <div class="ability-cost-inputs">${inputs}</div>
            <div class="modal-actions"><button class="button" type="button" data-action="cancel-ability-costs">Cancel</button><button class="button primary" type="submit">Use ability</button></div>
          </form>
        </section></div>`;
      root.querySelector("input")?.focus();
    }

    function useAbility(abilityId, suppliedValues = {}) {
      const character = getSelectedCharacter();
      const progress = state.characters[character.id];
      const configuredAbility = allCharacterAbilities(character).find((entry) => entry.id === abilityId);
      if (!configuredAbility) return;
      const ability = selectedAbilityFor(character, configuredAbility);
      if (isPassiveConfiguration(ability)) return;
      if (ability.crystalSummon && (
        !Number.isSafeInteger(ability.crystalSummon.max) ||
        ability.crystalSummon.max < 1 ||
        !Number.isSafeInteger(ability.crystalSummon.disableTurns) ||
        ability.crystalSummon.disableTurns < 1
      )) {
        console.error(`Invalid crystal summon configuration for ${character.name}'s ${ability.name}.`, ability.crystalSummon);
        notify(`${ability.name} has an invalid crystal configuration. Check the code.`);
        return;
      }
      if (hasUnlockedPotential(character) && hasNegativeCastingResource(character)) {
        notify("Too exhausted to cast: mana and stamina must be nonnegative.");
        return false;
      }
      if (ability.manaTide && state.manaTide?.active) return;
      if (ability.manaTide && !isValidManaTideConfiguration(ability.manaTide)) {
        console.error(`Invalid Mana Tide configuration for ${character.name}.`, ability.manaTide);
        notify("Mana Tide has an invalid configuration. Check the code.");
        return;
      }
      const toggleable = ability.activeMode === "toggle";
      const invalidEffect = (ability.statEffects || []).find((effect) => !isValidStatEffect(effect, character, toggleable));
      if (invalidEffect) {
        console.error(`Invalid stat effect configured for ${character.name}'s ${ability.name}.`, invalidEffect);
        notify(`${ability.name} has an invalid stat effect configuration. Check the code.`);
        return;
      }
      if (toggleable && !isValidAbilityUpkeep(ability)) {
        console.error(`Invalid upkeep configured for ${character.name}'s ${ability.name}.`, ability.upkeep);
        notify(`${ability.name} has an invalid upkeep configuration. Check the code.`);
        return;
      }
      const resourceEffects = ability.resourceEffects || [];
      const validResources = ["health", "mana", "stamina"];
      const invalidResourceEffect = resourceEffects.find((effect) =>
        !effect ||
        typeof effect.id !== "string" ||
        !effect.id.trim() ||
        !validResources.includes(effect.resource) ||
        !(isConfigurableAbilityValue(effect.amount) || Number.isSafeInteger(effect.amount)) ||
        !["self", "party", "others", "tagged", "self-and-tagged"].includes(effect.target) ||
        (["tagged", "self-and-tagged"].includes(effect.target) &&
          (!Array.isArray(effect.tags) || !effect.tags.length || !effect.tags.every((tag) => typeof tag === "string" && tag.trim())))
      );
      if (invalidResourceEffect) {
        console.error(`Invalid resource effect configured for ${character.name}'s ${ability.name}.`, invalidResourceEffect);
        notify(`${ability.name} has an invalid resource effect configuration. Check the code.`);
        return;
      }
      const invalidAfflictionEffect = (ability.afflictionEffects || []).find((effect) =>
        !isValidAfflictionEffect(effect) ||
        (effect.stacksFromInput && !(ability.inputFields || []).some((field) => field.id === effect.stacksFromInput.field)) ||
        (effect.trigger === "resourceChange" && !resourceEffects.some((resourceEffect) => resourceEffect.id === effect.resourceEffectId))
      );
      if (invalidAfflictionEffect) {
        console.error(`Invalid affliction effect configured for ${character.name}'s ${ability.name}.`, invalidAfflictionEffect);
        notify(`${ability.name} has an invalid affliction effect configuration. Check the code.`);
        return;
      }
      const isRacialGift = (character.racialGifts || []).some((gift) => gift.id === abilityId);
      const stateKey = abilityStateKey(configuredAbility, ability.id === configuredAbility.id ? null : ability);
      if (toggleable && progress.activeAbilities?.[stateKey]) return;
      const crystals = ability.crystalSummon ? progress.crystals?.[configuredAbility.id] || [] : [];
      if (ability.crystalSummon && crystals.length >= ability.crystalSummon.max) {
        notify(`You can have at most ${ability.crystalSummon.max} mana crystals at a time.`);
        return;
      }
      const chargeRecharges = progress.chargeRecharges?.[stateKey] || [];
      const hasCharges = Number.isInteger(ability.charges) && ability.charges > 0 &&
        Number.isInteger(ability.recharge) && ability.recharge > 0;
      const usesPerTurn = Number.isInteger(ability.usesPerTurn) && ability.usesPerTurn > 0
        ? ability.usesPerTurn
        : 1;
      if (
        (progress.abilityUsesThisTurn?.[abilityId] || 0) >= usesPerTurn ||
        (progress.cooldowns[stateKey] || 0) > 0 ||
        (progress.activeTurns[stateKey] || 0) > 0 ||
        (hasCharges && chargeRecharges.length >= ability.charges)
      ) return;
      const manaCost = ability.mana;
      const staminaCost = ability.stamina;
      const configurableFields = configurableAbilityFields(ability, isRacialGift);
      if (configurableFields.some((field) => !Object.hasOwn(suppliedValues, field))) {
        showAbilityCostForm(abilityId, ability.name, configurableFields, ability);
        return false;
      }
      const invalidInput = (ability.inputFields || []).find((field) =>
        !field ||
        typeof field.id !== "string" ||
        !field.id.trim() ||
        typeof field.label !== "string" ||
        !field.label.trim() ||
        (field.min !== undefined && !Number.isSafeInteger(field.min)) ||
        !Number.isSafeInteger(suppliedValues[`input:${field.id}`]) ||
        suppliedValues[`input:${field.id}`] < (field.min ?? 0)
      );
      if (invalidInput) {
        console.error(`Invalid input field value configured for ${character.name}'s ${ability.name}.`, invalidInput);
        notify("Enter valid whole-number values for this ability.");
        return false;
      }
      const resolvedResourceEffects = resourceEffects.map((effect) => ({
        ...effect,
        amount: isConfigurableAbilityValue(effect.amount)
          ? suppliedValues[`resourceEffect:${effect.id}`]
          : effect.amount
      }));
      if (resolvedResourceEffects.some((effect) => !Number.isSafeInteger(effect.amount))) {
        notify("Resource changes must be whole numbers.");
        return false;
      }
      const baseCosts = {
        mana: isConfigurableAbilityValue(manaCost) ? suppliedValues.mana : manaCost ?? 0,
        stamina: isConfigurableAbilityValue(staminaCost) ? suppliedValues.stamina : staminaCost ?? 0
      };
      const resolvedValues = {
        mana: getEffectiveAbilityCost(character, "mana", baseCosts.mana, ability).cost,
        stamina: getEffectiveAbilityCost(character, "stamina", baseCosts.stamina, ability).cost,
        cooldown: isConfigurableAbilityValue(ability.cooldown) ? suppliedValues.cooldown : ability.cooldown ?? 0
      };
      if (Object.values(resolvedValues).some((value) => !Number.isSafeInteger(value) || value < 0)) {
        notify("Mana, stamina, and cooldown values must be whole numbers of zero or more.");
        return false;
      }
      if (!canPayAbilityResources(character, resolvedValues, resolvedResourceEffects)) {
        notify("Not enough mana or stamina for those configured costs.");
        return false;
      }

      progress.resources.mana -= resolvedValues.mana;
      progress.resources.stamina -= resolvedValues.stamina;
      recordManaSpent(character.id, resolvedValues.mana);
      if (hasCharges) {
        progress.chargeRecharges ??= {};
        progress.chargeRecharges[stateKey] ??= [];
        progress.chargeRecharges[stateKey].push(ability.recharge);
      }
      if (ability.crystalSummon) {
        progress.crystals ??= {};
        progress.crystals[configuredAbility.id] ??= [];
        state.crystalSequence += 1;
        progress.crystals[configuredAbility.id].push({
          id: `mana-crystal-${state.crystalSequence}`,
          disabledTurns: 0
        });
      }
      const resourceChanges = [];
      for (const effect of resolvedResourceEffects) {
        for (const targetCharacterId of statEffectTargets(effect, character)) {
          const targetCharacter = characterById(targetCharacterId);
          const targetResources = state.characters[targetCharacterId].resources;
          const previousAmount = targetResources[effect.resource];
          targetResources[effect.resource] = Math.max(
            minimumResourceValue(targetCharacter, effect.resource),
            Math.min(
              targetCharacter.resources[effect.resource],
              previousAmount + effect.amount
            )
          );
          const actualChange = targetResources[effect.resource] - previousAmount;
          resourceChanges.push({
            resourceEffectId: effect.id,
            resource: effect.resource,
            targetCharacterId,
            amount: actualChange
          });
          if (effect.resource === "mana" && targetResources.mana < previousAmount) {
            recordManaSpent(targetCharacterId, previousAmount - targetResources.mana);
          }
        }
      }
      for (const effect of ability.afflictionEffects || []) {
        const matchingChanges = effect.trigger === "resourceChange"
          ? resourceChanges.filter((change) =>
            change.resourceEffectId === effect.resourceEffectId &&
            (effect.condition === "increase" ? change.amount > 0 : change.amount < 0)
          )
          : [null];
        for (const change of matchingChanges) {
          let stacks = effect.stacks || 1;
          if (effect.stacksFromInput) {
            stacks = Math.floor(
              suppliedValues[`input:${effect.stacksFromInput.field}`] / effect.stacksFromInput.divisor
            );
          }
          if (change && effect.stacksFromPercentageOfMax) {
            const maximum = characterById(change.targetCharacterId).resources[change.resource];
            stacks = Math.max(1, Math.ceil(Math.abs(change.amount) / maximum * 100));
          }
          if (!Number.isSafeInteger(stacks) || stacks <= 0) continue;
          for (const targetCharacterId of statEffectTargets(effect, character)) {
            applyConfiguredAfflictionEffect(
              character,
              ability,
              effect,
              targetCharacterId,
              stacks
            );
          }
        }
      }
      if (ability.manaTide) {
        state.manaTide = {
          active: true,
          sourceCharacterId: character.id,
          roundsElapsed: 0,
          spentByCharacter: {}
        };
      }
      progress.abilityUsesThisTurn ??= {};
      progress.abilityUsesThisTurn[abilityId] = (progress.abilityUsesThisTurn[abilityId] || 0) + 1;
      progress.cooldowns[stateKey] = resolvedValues.cooldown;
      progress.activeTurns[stateKey] = Math.max(0, ability.duration || 0);
      if (toggleable) {
        progress.activeAbilities ??= {};
        progress.activeAbilities[stateKey] = true;
      }
      const affectedCharacterIds = new Set([character.id, ...resourceChanges.map((change) => change.targetCharacterId)]);
      const deactivatedAbilities = [...new Set([...affectedCharacterIds].flatMap((characterId) =>
        deactivateToggleAbilitiesForExhaustedCharacter(characterById(characterId))
      ))];
      for (const effect of toggleable ? [] : ability.statEffects || []) {
        for (const targetCharacterId of statEffectTargets(effect, character)) {
          state.activeStatEffects.push({
            id: `${state.turn}:${character.id}:${ability.id}:${effect.id}:${targetCharacterId}`,
            sourceCharacterId: character.id,
            sourceAbilityId: configuredAbility.id,
            sourceConfigurationId: ability.id,
            effectId: effect.id,
            bonus: enhancedAbilityEffectBonus(character, configuredAbility, ability, effect.stat, effect.bonus),
            targetCharacterId,
            remainingTurns: effect.duration
          });
        }
      }
      saveCampaign();
      render();
      notify(`${ability.name} ${toggleable ? "activated" : "used"}${ability.duration && !toggleable ? ` for ${ability.duration} turns` : ""} — ${character.name}'s resources updated.${deactivatedAbilities.length ? ` Active abilities turned off: ${deactivatedAbilities.join(", ")}.` : ""}`);
      return true;
    }

    function disableCrystal(abilityId, crystalId) {
      const character = getSelectedCharacter();
      const ability = allCharacterAbilities(character).find((entry) => entry.id === abilityId);
      const crystal = state.characters[character.id].crystals?.[abilityId]?.find((entry) => entry.id === crystalId);
      if (!ability?.crystalSummon || !crystal || crystal.disabledTurns > 0) return;
      crystal.disabledTurns = ability.crystalSummon.disableTurns;
      saveCampaign();
      render();
      notify(`${character.name}'s crystal is disabled for ${crystal.disabledTurns} turns.`);
    }

    function dispelCrystal(abilityId, crystalId) {
      const character = getSelectedCharacter();
      const progress = state.characters[character.id];
      const crystals = progress.crystals?.[abilityId];
      const index = crystals?.findIndex((entry) => entry.id === crystalId) ?? -1;
      if (index < 0) return;
      crystals.splice(index, 1);
      progress.resources.mana = Math.min(character.resources.mana, progress.resources.mana + 50);
      saveCampaign();
      render();
      notify(`${character.name} dispels a mana crystal and restores 50 mana.`);
    }

    function toggleAbility(abilityId) {
      const character = getSelectedCharacter();
      const configuredAbility = allCharacterAbilities(character).find((entry) => entry.id === abilityId);
      if (!configuredAbility) return;
      const ability = selectedAbilityFor(character, configuredAbility);
      if (ability.activeMode !== "toggle") return;
      const stateKey = abilityStateKey(configuredAbility, ability.id === configuredAbility.id ? null : ability);
      const progress = state.characters[character.id];
      if (!progress.activeAbilities?.[stateKey]) {
        useAbility(abilityId);
        return;
      }
      progress.activeAbilities[stateKey] = false;
      saveCampaign();
      render();
      notify(`${ability.name} turned off.`);
    }

    function toggleEquipment(itemId) {
      const character = getSelectedCharacter();
      const item = (character.equipment || []).find((entry) => entry.id === itemId);
      if (!item) return;
      const progress = state.characters[character.id];
      progress.equippedEquipment ??= [];
      const isEquipped = progress.equippedEquipment.includes(item.id);
      progress.equippedEquipment = isEquipped
        ? progress.equippedEquipment.filter((equippedId) => equippedId !== item.id)
        : [...progress.equippedEquipment, item.id];
      saveCampaign();
      render();
      notify(`${item.name} ${isEquipped ? "unequipped" : "equipped"}.`);
    }

    function addManualAffliction(characterId, afflictionId, stacks, duration) {
      if (!characterById(characterId) || !Object.hasOwn(AFFLICTION_GLOSSARY, afflictionId) ||
        !Number.isSafeInteger(stacks) || stacks < 1 || stacks > 999 ||
        !(duration === null || (Number.isSafeInteger(duration) && duration > 0 && duration <= 999))) {
        notify("Choose a character, affliction, positive stack count, and valid duration.");
        return;
      }
      applyAffliction(characterId, afflictionId, stacks, duration, "Manually added");
      saveCampaign();
      render();
      notify(`${AFFLICTION_GLOSSARY[afflictionId].name} applied to ${characterById(characterId).name}.`);
    }

    function removeAffliction(afflictionId, removeAll = false) {
      const entry = state.activeAfflictions.find((activeEntry) => activeEntry.id === afflictionId);
      if (!entry) return;
      if (removeAll || entry.stacks <= 1) {
        state.activeAfflictions = state.activeAfflictions.filter((activeEntry) => activeEntry.id !== afflictionId);
      } else {
        entry.stacks -= 1;
      }
      saveCampaign();
      render();
    }

    function recoverFromAfflictions(character) {
      const progress = state.characters[character.id];
      for (const entry of state.activeAfflictions.filter((activeEntry) => activeEntry.characterId === character.id)) {
        const affliction = AFFLICTION_GLOSSARY[entry.afflictionId];
        for (const effect of affliction.resourceEffects || []) {
          if (
            !effect ||
            !["health", "mana", "stamina"].includes(effect.resource) ||
            !Number.isSafeInteger(effect.amountPerStack) ||
            effect.amountPerStack < 0
          ) {
            console.error(`Invalid resource effect configured for ${affliction.name}.`, effect);
            continue;
          }
          const amount = effect.amountPerStack * entry.stacks;
          progress.resources[effect.resource] = Math.min(
            character.resources[effect.resource],
            progress.resources[effect.resource] + amount
          );
        }
      }
    }

    function applyWeaponAfflictionEffects(character, item, selectedTargetId) {
      const effects = item.afflictionEffects || [];
      const invalidEffect = effects.find((effect) => !isValidWeaponAfflictionEffect(effect));
      if (invalidEffect) {
        console.error(`Invalid weapon affliction configured for ${item.name}.`, invalidEffect);
        notify(`${item.name} has an invalid affliction configuration. Check the code.`);
        return null;
      }
      if (effects.some((effect) => ["selected", "wielder-and-selected"].includes(effect.target)) &&
          !characterById(selectedTargetId)) {
        notify(`Choose a valid party target for ${item.name}.`);
        return null;
      }

      const appliedAfflictions = [];
      for (const effect of effects) {
        const recipients = effect.target === "wielder"
          ? [character.id]
          : effect.target === "selected"
            ? [selectedTargetId]
            : [...new Set([character.id, selectedTargetId])];
        for (const recipientId of recipients) {
          applyConfiguredAfflictionEffect(
            character,
            item,
            { ...effect, target: "self" },
            recipientId,
            effect.stacks || 1
          );
          appliedAfflictions.push(`${AFFLICTION_GLOSSARY[effect.afflictionId].name} → ${characterById(recipientId).name}`);
        }
      }
      return appliedAfflictions;
    }

    function attackWithEquipment(itemId, attackId, selectedTargetId = null) {
      const character = getSelectedCharacter();
      const item = (character.equipment || []).find((entry) => entry.id === itemId && entry.type === "weapon");
      if (!item || !state.characters[character.id].equippedEquipment?.includes(item.id)) return;
      const attack = equipmentAttacks(item).find((entry) => entry.id === attackId);
      const result = attack && equipmentAttackResult(character, item, attack);
      if (!attack || !isValidAttackConfiguration(character, item, attack) || !result) {
        console.error(`Invalid weapon attack configuration for ${character.name}'s ${item.name}.`, attack);
        notify(`${item.name} has an invalid attack stat, damage formula, or damage multiplier configuration. Check the code.`);
        return;
      }
      const afflictions = applyWeaponAfflictionEffects(character, item, selectedTargetId);
      if (afflictions === null) return;
      const damageSummary = equipmentAttackSummary(character, item, attack);
      state.equipmentAttackLog ??= [];
      state.equipmentAttackLog.push({
        characterId: character.id,
        equipmentId: item.id,
        attackId: attack.id,
        turn: state.turn,
        damageSummary
      });
      state.equipmentAttackLog = state.equipmentAttackLog.slice(-10);
      saveCampaign();
      render();
      notify(`${character.name} uses ${attack.name} with ${item.name} — ${damageSummary}.${afflictions.length ? ` ${afflictions.join("; ")}.` : ""}`);
    }

    function attackWithAbility(abilityId, attackId) {
      const character = getSelectedCharacter();
      const ability = allCharacterAbilities(character).find((entry) => entry.id === abilityId);
      if (!ability || !abilityHasAnyTag(ability, ["attack"])) return;
      const selectedAbility = selectedAbilityFor(character, ability);
      const attack = abilityAttacks(selectedAbility).find((entry) => entry.id === attackId);
      if (!attack || !isValidAttackConfiguration(character, selectedAbility, attack)) {
        console.error(`Invalid ability attack configuration for ${character.name}'s ${ability.name}.`, attack);
        notify(`${ability.name} has an invalid attack stat or damage formula. Check the code.`);
        return;
      }
      const damageSummary = equipmentAttackSummary(character, selectedAbility, attack);
      notify(`${character.name} attacks with ${ability.name} (${attack.name}) — ${damageSummary}.`);
    }

    function endTurn() {
      const character = getCurrentCharacter();
      const progress = state.characters[character.id];
      let manaTideEnded = false;
      // Recovery is capped at each character's configured maximum; no resource can overflow.
      progress.resources.mana = Math.min(character.resources.mana, progress.resources.mana + Math.round(effectiveRecovery(character, "manaRecovery")));
      progress.resources.stamina = Math.min(character.resources.stamina, progress.resources.stamina + effectiveRecovery(character, "staminaRecovery"));
      recoverFromAfflictions(character);
      const deactivatedAbilities = [];
      for (const ability of allCharacterAbilities(character)) {
        for (const configuration of [ability, ...(ability.variants || [])]) {
          if (configuration.activeMode !== "toggle") continue;
          const stateKey = abilityStateKey(ability, configuration === ability ? null : configuration);
          if (!progress.activeAbilities?.[stateKey]) continue;
          if (!isValidAbilityUpkeep(configuration)) {
            console.error(`Invalid upkeep configured for ${character.name}'s ${ability.name}.`, configuration.upkeep);
            progress.activeAbilities[stateKey] = false;
            deactivatedAbilities.push(`${ability.name} (invalid upkeep)`);
            continue;
          }
          const upkeepCosts = Object.entries(configuration.upkeep || {})
            .filter(([, amount]) => amount > 0)
            .map(([resource, amount]) => ({
              resource,
              ...getEffectiveAbilityUpkeep(character, resource, amount, {
                ...ability,
                ...configuration,
                tags: [...new Set([...(ability.tags || []), ...(configuration.tags || [])])]
              })
            }));
          const unaffordable = upkeepCosts.find((cost) => progress.resources[cost.resource] < cost.cost);
          if (unaffordable) {
            progress.activeAbilities[stateKey] = false;
            deactivatedAbilities.push(`${ability.name} (not enough ${unaffordable.resource})`);
            continue;
          }
          for (const cost of upkeepCosts) {
            progress.resources[cost.resource] -= cost.cost;
            if (cost.resource === "mana") recordManaSpent(character.id, cost.cost);
          }
        }
      }
      for (const ability of allCharacterAbilities(character)) {
        if (progress.crystals?.[ability.id]) {
          progress.crystals[ability.id] = progress.crystals[ability.id].map((crystal) => ({
            ...crystal,
            disabledTurns: Math.max(0, crystal.disabledTurns - 1)
          }));
        }
        const configurations = [ability, ...(ability.variants || [])];
        for (const configuration of configurations) {
          if (isPassiveConfiguration(configuration)) continue;
          const stateKey = abilityStateKey(ability, configuration === ability ? null : configuration);
          if (progress.chargeRecharges?.[stateKey]?.length) {
            progress.chargeRecharges[stateKey] = progress.chargeRecharges[stateKey]
              .map((turns) => turns - 1)
              .filter((turns) => turns > 0);
          }
          if (progress.activeTurns[stateKey] > 0) {
            progress.activeTurns[stateKey] -= 1;
            continue;
          }
          progress.cooldowns[stateKey] = Math.max(0, (progress.cooldowns[stateKey] || 0) - 1);
        }
      }
      progress.abilityUsesThisTurn = Object.fromEntries(
        allCharacterAbilities(character).map((ability) => [ability.id, 0])
      );
      progress.afflictionApplicationsThisTurn = {};
      state.activeStatEffects = state.activeStatEffects.flatMap((effect) => {
        if (effect.targetCharacterId !== character.id) return [effect];
        return effect.remainingTurns > 1
          ? [{ ...effect, remainingTurns: effect.remainingTurns - 1 }]
          : [];
      });
      state.activeAfflictions = state.activeAfflictions.flatMap((entry) => {
        if (entry.characterId !== character.id || entry.remainingTurns === null) return [entry];
        return entry.remainingTurns > 1
          ? [{ ...entry, remainingTurns: entry.remainingTurns - 1 }]
          : [];
      });
      state.turnIndex = (state.turnIndex + 1) % CHARACTERS.length;
      // Round counter advances only when turn order wraps back to the first character.
      if (state.turnIndex === 0) {
        state.turn += 1;
        if (state.manaTide?.active) {
          const configured = manaTideAbility()?.ability.manaTide;
          if (!isValidManaTideConfiguration(configured) || state.manaTide.roundsElapsed + 1 >= configured.durationRounds) {
            state.manaTide.active = false;
            manaTideEnded = true;
          } else {
            state.manaTide.roundsElapsed += 1;
          }
        }
      }
      saveCampaign();
      render();
      notify(`${character.name}'s turn ended. Resources recovered and cooldowns reduced.${deactivatedAbilities.length ? ` Turned off: ${deactivatedAbilities.join(", ")}.` : ""}${manaTideEnded ? " Mana Tide has ended." : ""}`);
    }

    function resetCampaign() {
      // Restore initial resources and clear turn, ability, and Mana Tide progress.
      for (const character of CHARACTERS) {
        state.characters[character.id] = {
          resources: { ...character.resources },
          cooldowns: Object.fromEntries(abilityConfigurationKeys(character).map((key) => [key, 0])),
          activeTurns: Object.fromEntries(abilityConfigurationKeys(character).map((key) => [key, 0])),
          activeAbilities: Object.fromEntries(allCharacterAbilities(character).flatMap((ability) =>
            [ability, ...(ability.variants || [])]
              .filter((configuration) => configuration.activeMode === "toggle")
              .map((configuration) => [abilityStateKey(ability, configuration === ability ? null : configuration), false])
          )),
          chargeRecharges: Object.fromEntries(abilityConfigurationKeys(character).map((key) => [key, []])),
          crystals: Object.fromEntries(allCharacterAbilities(character)
            .filter((ability) => ability.crystalSummon)
            .map((ability) => [ability.id, []])),
          abilityUsesThisTurn: Object.fromEntries(allCharacterAbilities(character).map((ability) => [ability.id, 0])),
          afflictionApplicationsThisTurn: {},
          equippedEquipment: [...(state.characters[character.id].equippedEquipment || [])]
        };
      }
      state.activeStatEffects = [];
      state.activeAfflictions = [];
      state.afflictionSequence = 0;
      state.crystalSequence = 0;
      state.equipmentAttackLog = [];
      state.manaTide = { active: false, roundsElapsed: 0, spentByCharacter: {} };
      state.variantSelection = {};
      state.turn = 1;
      state.turnIndex = 0;
      saveCampaign();
      render();
      notify("Session reset. Resources, ability uses, active abilities, stat effects, afflictions, Mana Tide, and turn order are back at their defaults.");
    }

    function showResetConfirmation() {
      const root = document.getElementById("modal-root");
      root.innerHTML = `<div class="modal-backdrop" data-dismiss-modal>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
          <h2 id="reset-title">Reset this session?</h2>
          <p>All players’ resources, ability uses, cooldowns, toggle abilities, active stat effects, buffs, afflictions, and Mana Tide progress will return to their starting values. The turn counter will also reset. This cannot be undone.</p>
          <div class="modal-actions"><button class="button" data-action="cancel-reset">Keep playing</button><button class="button primary" data-action="reset">Reset session</button></div>
        </section></div>`;
      root.querySelector("[data-action='cancel-reset']").focus();
    }

    function showAfflictionGlossary(key) {
      const entry = AFFLICTION_GLOSSARY[key];
      const title = entry?.name || key;
      const description = entry?.description || "No glossary description has been configured for this affliction yet.";
      const root = document.getElementById("modal-root");
      root.innerHTML = `<div class="modal-backdrop" data-dismiss-modal>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="glossary-title">
          <button class="modal-close" data-action="close-glossary" aria-label="Close glossary">×</button>
          <h2 id="glossary-title">${escapeHtml(title)}</h2>
          <p>${escapeHtml(description)}</p>
        </section></div>`;
      root.querySelector("[data-action='close-glossary']").focus();
    }

    // One delegated handler keeps controls working after every render.
    document.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      if (!target) return;

      const viewButton = target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.dataset.view;
        saveCampaign();
        render();
        return;
      }

      const rosterButton = target.closest("[data-character]");
      if (rosterButton) {
        state.selectedId = rosterButton.dataset.character;
        state.view = "sheet";
        saveCampaign();
        render();
        return;
      }

      const card = target.closest("[data-open-character]");
      if (card) {
        state.selectedId = card.dataset.openCharacter;
        state.view = "sheet";
        saveCampaign();
        render();
        return;
      }

      const resourceButton = target.closest("[data-resource]");
      if (resourceButton) {
        const amount = Number(document.querySelector("[data-resource-adjustment]")?.value);
        if (!Number.isSafeInteger(amount) || amount < 1) {
          notify("Enter a whole number greater than zero for the resource adjustment.");
          document.querySelector("[data-resource-adjustment]")?.focus();
          return;
        }
        setResource(state.selectedId, resourceButton.dataset.resource, Number(resourceButton.dataset.delta) * amount);
        return;
      }

      const glossaryButton = target.closest("[data-glossary]");
      if (glossaryButton) {
        showAfflictionGlossary(glossaryButton.dataset.glossary);
        return;
      }

      const abilityButton = target.closest("[data-use-ability]");
      if (abilityButton) {
        useAbility(abilityButton.dataset.useAbility);
        return;
      }

      const abilityAttack = target.closest("[data-ability-attack]");
      if (abilityAttack) {
        attackWithAbility(abilityAttack.dataset.abilityAttack, abilityAttack.dataset.abilityAttackId);
        return;
      }

      const abilityToggle = target.closest("[data-toggle-ability]");
      if (abilityToggle) {
        toggleAbility(abilityToggle.dataset.toggleAbility);
        return;
      }

      const crystalDisable = target.closest("[data-disable-crystal]");
      if (crystalDisable) {
        disableCrystal(crystalDisable.dataset.crystalAbility, crystalDisable.dataset.disableCrystal);
        return;
      }

      const crystalDispel = target.closest("[data-dispel-crystal]");
      if (crystalDispel) {
        dispelCrystal(crystalDispel.dataset.crystalAbility, crystalDispel.dataset.dispelCrystal);
        return;
      }

      const equipmentToggle = target.closest("[data-equipment-toggle]");
      if (equipmentToggle) {
        toggleEquipment(equipmentToggle.dataset.equipmentToggle);
        return;
      }

      const equipmentAttack = target.closest("[data-equipment-attack]");
      if (equipmentAttack) {
        const targetPicker = equipmentAttack.closest(".equipment-attack-option")?.querySelector("[data-equipment-target]");
        attackWithEquipment(
          equipmentAttack.dataset.equipmentAttack,
          equipmentAttack.dataset.equipmentAttackId,
          targetPicker?.value || null
        );
        return;
      }

      const afflictionRemove = target.closest("[data-affliction-remove]");
      if (afflictionRemove) {
        removeAffliction(afflictionRemove.dataset.afflictionRemove);
        return;
      }
      const afflictionClear = target.closest("[data-affliction-clear]");
      if (afflictionClear) {
        removeAffliction(afflictionClear.dataset.afflictionClear, true);
        return;
      }

      const action = target.closest("[data-action]")?.dataset.action;
      if (action === "end-turn") endTurn();
      if (action === "confirm-reset") showResetConfirmation();
      if (action === "cancel-reset") document.getElementById("modal-root").innerHTML = "";
      if (action === "close-glossary") document.getElementById("modal-root").innerHTML = "";
      if (action === "cancel-ability-costs") document.getElementById("modal-root").innerHTML = "";
      if (action === "reset") {
        document.getElementById("modal-root").innerHTML = "";
        resetCampaign();
      }
      if (target.matches("[data-dismiss-modal]")) document.getElementById("modal-root").innerHTML = "";
    });

    document.addEventListener("submit", (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      event.preventDefault();
      if (form.matches("[data-add-affliction]")) {
        const values = new FormData(form);
        const durationValue = String(values.get("duration") || "").trim();
        addManualAffliction(
          String(values.get("characterId") || ""),
          String(values.get("afflictionId") || ""),
          Number(values.get("stacks")),
          durationValue ? Number(durationValue) : null
        );
        return;
      }
      if (!form.matches("[data-configurable-ability]")) return;
      const values = Object.fromEntries(new FormData(form).entries());
      for (const [field, value] of Object.entries(values)) values[field] = Number(value);
      if (useAbility(form.dataset.configurableAbility, values)) {
        document.getElementById("modal-root").innerHTML = "";
      }
    });

    // Variant selection changes only this device's sheet preference; game state remains shared.
    document.addEventListener("change", (event) => {
      const target = event.target;
      if (target instanceof HTMLInputElement && target.matches("[data-resource-adjustment]")) {
        resourceAdjustmentAmount = target.value;
        return;
      }
      if (!(target instanceof HTMLSelectElement) || !target.matches("[data-variant-character]")) return;
      selectAbilityVariant(target.dataset.variantCharacter, target.dataset.variantAbility, target.value);
    });

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target instanceof HTMLInputElement && target.matches("[data-resource-adjustment]")) {
        resourceAdjustmentAmount = target.value;
      }
    });

    // Allow keyboard activation on overview character cards, in addition to mouse/touch.
    document.addEventListener("keydown", (event) => {
      if ((event.key === "Enter" || event.key === " ") && event.target instanceof Element) {
        const card = event.target.closest("[data-open-character]");
        if (card) {
          event.preventDefault();
          card.click();
        }
      }
      if (event.key === "Escape") document.getElementById("modal-root").innerHTML = "";
    });

    render();
    startFirebaseSync();
  </script>
</body>
</html>
